<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Backlink Gap Analizi — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="table" x-data="{
  yourDomain: 'acme.com',
  comp1: '',
  comp2: '',
  comp3: '',
  comp4: '',
  analyzed: false,
  loading: false,
  onlyMissing: false,
  sortCol: 'dr',
  sortDir: 'desc',
  stats: { you: '12.4K', r1: '18.2K', r2: '9.8K', r3: '14.1K', r4: '7.3K', gap: '6.8K' },
  results: [],
  doAnalysis() {
    this.loading = true;
    this.analyzed = false;
    setTimeout(() => {
      const domains = ['webrazzi.com','dijitalajanslar.com','pazarlamasyon.com','teknoseyir.com','seorehberi.net','medium.com','forbes.com','chip.com.tr','log.com.tr','shiftdelete.net','donanimhaber.com','sosyalmedya.co','hubspot.com','moz.com','ahrefs.com'];
      this.results = domains.map(d => ({
        domain: d,
        dr: Math.floor(Math.random()*60)+30,
        you: Math.random() > 0.6,
        r1: Math.random() > 0.35,
        r2: Math.random() > 0.45,
        r3: Math.random() > 0.4,
        r4: Math.random() > 0.55,
      }));
      this.loading = false;
      this.analyzed = true;
      this.$nextTick(() => this.initVennChart());
    }, 1500);
  },
  initVennChart() {
    const el = document.getElementById('venn-chart');
    if (!el) return;
    const t = getChartTheme();
    const you = this.results.filter(r => r.you).length;
    const r1 = this.results.filter(r => r.r1).length;
    const r2 = this.results.filter(r => r.r2).length;
    const youR1 = this.results.filter(r => r.you && r.r1).length;
    const youR2 = this.results.filter(r => r.you && r.r2).length;
    const r1R2 = this.results.filter(r => r.r1 && r.r2).length;
    const all3 = this.results.filter(r => r.you && r.r1 && r.r2).length;
    const c = echarts.init(el);
    c.setOption({
      tooltip:{ backgroundColor:t.bg, borderColor:t.border, textStyle:{color:t.text,fontSize:11} },
      series:[{
        type:'scatter', symbolSize:function(val){ return Math.max(60, val[2] * 14); },
        label:{ show:true, formatter:function(p){ return p.data[3] + '\n' + p.data[2]; }, fontSize:11, color:'#fff', fontWeight:600, lineHeight:16 },
        itemStyle:{ opacity:0.65 },
        data:[
          [25, 50, you, 'Siz', '#C2410C'],
          [50, 65, r1, 'Rakip 1', '#3b82f6'],
          [75, 50, r2, 'Rakip 2', '#a855f7'],
          [37, 58, youR1, 'Siz+R1', '#22c55e'],
          [63, 58, r1R2, 'R1+R2', '#eab308'],
          [50, 42, youR2, 'Siz+R2', '#ef4444'],
          [50, 52, all3, 'Ortak', '#fff']
        ].map(d => ({value:[d[0],d[1],d[2]], name:d[3], itemStyle:{color:d[4]}, label:{color: d[4]==='#fff' ? t.text : '#fff'}}))
      }],
      xAxis:{show:false, min:0, max:100},
      yAxis:{show:false, min:20, max:80},
      grid:{left:20,right:20,top:10,bottom:10}
    });
    window.addEventListener('resize', () => c.resize());
  },
  get filtered() {
    let r = this.results;
    if (this.onlyMissing) r = r.filter(x => !x.you);
    if (this.sortCol) {
      r = [...r].sort((a,b) => {
        let va = a[this.sortCol], vb = b[this.sortCol];
        if (typeof va === 'boolean') { va = va ? 1 : 0; vb = vb ? 1 : 0; }
        let cmp = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb),'tr');
        return this.sortDir === 'asc' ? cmp : -cmp;
      });
    }
    return r;
  },
  doSort(col) {
    if (this.sortCol === col) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
    else { this.sortCol = col; this.sortDir = 'desc'; }
  },
  exportCSV() {
    const headers = ['Domain','DR','Siz','Rakip1','Rakip2','Rakip3','Rakip4'];
    const rows = this.filtered.map(r => [r.domain, r.dr, r.you?'Evet':'Hayir', r.r1?'Evet':'Hayir', r.r2?'Evet':'Hayir', r.r3?'Evet':'Hayir', r.r4?'Evet':'Hayir']);
    exportToCSV(headers, rows, 'backlink-gap.csv');
  }
}">
  <!-- Header -->
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">Backlink Gap Analizi</h1>
    <p class="page-sub">Rakiplerinizin sahip oldugu ama sizde olmayan backlink firsatlarini kesfet</p>
  </div>

  <!-- Domain Inputs -->
  <div class="fade-in-d1 card" style="padding:var(--sp-5);margin-bottom:var(--sp-6)">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-4)">
      <div>
        <label style="font-size:var(--fs-xs);color:var(--accent);font-weight:600;text-transform:uppercase;display:block;margin-bottom:var(--sp-2)">Sizin Domain</label>
        <input type="text" x-model="yourDomain" style="width:100%;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);border:1px solid var(--accent);background:var(--surface-2);color:var(--accent);font-size:var(--fs-sm);outline:none;font-family:inherit;font-weight:600">
      </div>
      <div>
        <label style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;display:block;margin-bottom:var(--sp-2)">Rakip 1</label>
        <input type="text" x-model="comp1" placeholder="rakip1.com" style="width:100%;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-sm);outline:none;font-family:inherit">
      </div>
      <div>
        <label style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;display:block;margin-bottom:var(--sp-2)">Rakip 2</label>
        <input type="text" x-model="comp2" placeholder="rakip2.com" style="width:100%;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-sm);outline:none;font-family:inherit">
      </div>
      <div>
        <label style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;display:block;margin-bottom:var(--sp-2)">Rakip 3</label>
        <input type="text" x-model="comp3" placeholder="rakip3.com" style="width:100%;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-sm);outline:none;font-family:inherit">
      </div>
      <div>
        <label style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;display:block;margin-bottom:var(--sp-2)">Rakip 4</label>
        <input type="text" x-model="comp4" placeholder="rakip4.com" style="width:100%;padding:var(--sp-2) var(--sp-3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-sm);outline:none;font-family:inherit">
      </div>
    </div>
    <button @click="doAnalysis()" class="btn-primary" :disabled="loading">
      <i class="ph" :class="loading ? 'ph-circle-notch' : 'ph-arrows-left-right'" :style="loading && 'animation:spin 1s linear infinite'"></i>
      <span x-text="loading ? 'Karsilastiriliyor...' : 'Karsilastir'"></span>
    </button>
  </div>

  <!-- Results -->
  <template x-if="analyzed">
    <div>
      <!-- Summary Cards -->
      <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-6)">
        <div class="stat-card" style="--stripe:#C2410C">
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Siz</span>
          <div style="font-size:var(--fs-2xl);font-weight:300;color:var(--accent);margin-top:var(--sp-2)" x-text="stats.you"></div>
        </div>
        <div class="stat-card" style="--stripe:#3b82f6">
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Rakip 1</span>
          <div style="font-size:var(--fs-2xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)" x-text="stats.r1"></div>
        </div>
        <div class="stat-card" style="--stripe:#a855f7">
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Rakip 2</span>
          <div style="font-size:var(--fs-2xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)" x-text="stats.r2"></div>
        </div>
        <div class="stat-card" style="--stripe:#eab308">
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Rakip 3</span>
          <div style="font-size:var(--fs-2xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)" x-text="stats.r3"></div>
        </div>
        <div class="stat-card" style="--stripe:#ef4444">
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Gap (Fark)</span>
          <div style="font-size:var(--fs-2xl);font-weight:300;color:#ef4444;margin-top:var(--sp-2)" x-text="stats.gap"></div>
        </div>
      </div>

      <!-- Venn Diagram -->
      <div class="fade-in-d1 card" style="padding:var(--sp-4);margin-bottom:var(--sp-6)">
        <div style="font-size:var(--fs-sm);font-weight:600;color:var(--text);margin-bottom:var(--sp-3)">Backlink Overlap Gorsellestirmesi</div>
        <div id="venn-chart" style="width:100%;height:300px"></div>
      </div>

      <!-- Filter + Export -->
      <div class="fade-in-d2" style="display:flex;gap:var(--sp-3);margin-bottom:var(--sp-4);align-items:center;justify-content:space-between;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:var(--sp-2);cursor:pointer">
          <input type="checkbox" x-model="onlyMissing" style="accent-color:var(--accent)">
          <span style="font-size:var(--fs-sm);color:var(--text);font-weight:500">Sadece bize link vermeyenler</span>
        </label>
        <button @click="exportCSV()" style="font-size:var(--fs-sm);padding:var(--sp-2) var(--sp-4);border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-family:inherit;font-weight:600"><i class="ph ph-download-simple"></i> Firsat Listesi Indir (CSV)</button>
      </div>

      <!-- Gap Table -->
      <div class="fade-in-d2 card" data-paginate="20" style="padding:0;overflow:hidden">
        <div style="overflow-x:auto">
          <table class="r-table">
            <thead>
              <tr>
                <th @click="doSort('domain')" style="cursor:pointer">Referring Domain <i class="ph" :class="sortCol==='domain' ? (sortDir==='asc' ? 'ph-caret-up' : 'ph-caret-down') : 'ph-caret-up-down'" style="font-size:var(--fs-2xs);opacity:0.5"></i></th>
                <th @click="doSort('dr')" style="cursor:pointer">DR <i class="ph" :class="sortCol==='dr' ? (sortDir==='asc' ? 'ph-caret-up' : 'ph-caret-down') : 'ph-caret-up-down'" style="font-size:var(--fs-2xs);opacity:0.5"></i></th>
                <th style="text-align:center">Siz</th>
                <th style="text-align:center">Rakip 1</th>
                <th style="text-align:center">Rakip 2</th>
                <th style="text-align:center">Rakip 3</th>
                <th style="text-align:center">Rakip 4</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="row in filtered" :key="row.domain">
                <tr>
                  <td data-label="Domain"><span style="font-weight:500;color:var(--text)" x-text="row.domain"></span></td>
                  <td data-label="DR"><span style="font-weight:600;color:var(--text)" x-text="row.dr"></span></td>
                  <td data-label="Siz" style="text-align:center"><i class="ph" :class="row.you ? 'ph-check-circle' : 'ph-x-circle'" :style="row.you ? 'color:#22c55e;font-size:var(--fs-lg)' : 'color:#ef4444;font-size:var(--fs-lg)'"></i></td>
                  <td data-label="Rakip 1" style="text-align:center"><i class="ph" :class="row.r1 ? 'ph-check-circle' : 'ph-x-circle'" :style="row.r1 ? 'color:#22c55e;font-size:var(--fs-lg)' : 'color:#ef4444;font-size:var(--fs-lg)'"></i></td>
                  <td data-label="Rakip 2" style="text-align:center"><i class="ph" :class="row.r2 ? 'ph-check-circle' : 'ph-x-circle'" :style="row.r2 ? 'color:#22c55e;font-size:var(--fs-lg)' : 'color:#ef4444;font-size:var(--fs-lg)'"></i></td>
                  <td data-label="Rakip 3" style="text-align:center"><i class="ph" :class="row.r3 ? 'ph-check-circle' : 'ph-x-circle'" :style="row.r3 ? 'color:#22c55e;font-size:var(--fs-lg)' : 'color:#ef4444;font-size:var(--fs-lg)'"></i></td>
                  <td data-label="Rakip 4" style="text-align:center"><i class="ph" :class="row.r4 ? 'ph-check-circle' : 'ph-x-circle'" :style="row.r4 ? 'color:#22c55e;font-size:var(--fs-lg)' : 'color:#ef4444;font-size:var(--fs-lg)'"></i></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>
</div>

<div id="footbar"></div>
<script src="../js/mock-data.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('seo'));</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
