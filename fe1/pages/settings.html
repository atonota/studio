<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ayarlar — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/tokens.css">
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main">
  <div class="fade-in" style="margin-bottom:24px">
    <h1 class="page-title">Ayarlar</h1>
    <p class="page-sub">Hesap ve sistem tercihleri</p>
  </div>

  <div class="fade-in-d1 card" style="max-width:640px">
    <div style="display:flex;flex-direction:column;gap:0">
      <!-- Tema -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:12px">
          <i class="ph ph-moon" style="font-size:1.25rem;color:var(--muted)"></i>
          <div>
            <div style="font-size:0.875rem;font-weight:500;color:var(--text)">Tema</div>
            <div style="font-size:0.75rem;color:var(--muted)">Acik veya koyu gorunum</div>
          </div>
        </div>
        <div style="width:44px;height:24px;border-radius:12px;background:var(--accent);position:relative;cursor:pointer">
          <div style="width:20px;height:20px;border-radius:50%;background:white;position:absolute;top:2px;right:2px;transition:right 0.2s"></div>
        </div>
      </div>

      <!-- Dil -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:12px">
          <i class="ph ph-translate" style="font-size:1.25rem;color:var(--muted)"></i>
          <div>
            <div style="font-size:0.875rem;font-weight:500;color:var(--text)">Dil</div>
            <div style="font-size:0.75rem;color:var(--muted)">Arayuz dili</div>
          </div>
        </div>
        <span class="badge" style="background:var(--accent-soft);color:var(--accent)">TR</span>
      </div>

      <!-- 2FA -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:12px">
          <i class="ph ph-shield-check" style="font-size:1.25rem;color:var(--muted)"></i>
          <div>
            <div style="font-size:0.875rem;font-weight:500;color:var(--text)">Iki Faktorlu Kimlik Dogrulama</div>
            <div style="font-size:0.75rem;color:var(--muted)">TOTP ile ek guvenlik</div>
          </div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span>
      </div>

      <!-- API Keys -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 0">
        <div style="display:flex;align-items:center;gap:12px">
          <i class="ph ph-key" style="font-size:1.25rem;color:var(--muted)"></i>
          <div>
            <div style="font-size:0.875rem;font-weight:500;color:var(--text)">API Anahtarlari</div>
            <div style="font-size:0.75rem;color:var(--muted)">2 anahtar aktif</div>
          </div>
        </div>
        <button class="btn-secondary" style="padding:6px 12px;font-size:0.75rem">Yonet</button>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('settings'));</script>
</body>
</html>
