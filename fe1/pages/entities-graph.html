<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Knowledge Graph — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/tokens.css">
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main">
  <!-- Header -->
  <div class="fade-in" style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
    <div style="width:40px;height:40px;border-radius:10px;background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center">
      <i class="ph ph-graph" style="color:#3b82f6;font-size:1.25rem"></i>
    </div>
    <div>
      <h1 class="page-title">Knowledge Graph — atonota</h1>
      <p class="page-sub">Entity iliskileri ve baglantilari</p>
    </div>
  </div>

  <!-- Graph Placeholder -->
  <div class="fade-in-d1 card" style="margin-bottom:24px;padding:48px 24px;text-align:center">
    <i class="ph ph-graph" style="font-size:3rem;color:var(--muted);margin-bottom:16px;display:block"></i>
    <div style="font-size:1rem;font-weight:500;color:var(--text);margin-bottom:8px">Graf gorsellestirilecek</div>
    <div style="font-size:0.8125rem;color:var(--muted)">42 entity, 128 iliski</div>
  </div>

  <!-- Entity Relationship List -->
  <div class="fade-in-d2 card">
    <span class="section-label">Entity Iliskileri</span>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:0.875rem;font-weight:500;color:var(--text);min-width:140px">atonota</span>
        <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6;flex-shrink:0">is-a</span>
        <span style="font-size:0.875rem;color:var(--text-soft)">SaaS Platformu</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:0.875rem;font-weight:500;color:var(--text);min-width:140px">SEO Modulu</span>
        <span class="badge" style="background:rgba(168,85,247,0.1);color:#a855f7;flex-shrink:0">part-of</span>
        <span style="font-size:0.875rem;color:var(--text-soft)">atonota</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:0.875rem;font-weight:500;color:var(--text);min-width:140px">atonota</span>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e;flex-shrink:0">related-to</span>
        <span style="font-size:0.875rem;color:var(--text-soft)">WordPress</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:0.875rem;font-weight:500;color:var(--text);min-width:140px">atonota</span>
        <span class="badge" style="background:rgba(234,179,8,0.1);color:#eab308;flex-shrink:0">located-in</span>
        <span style="font-size:0.875rem;color:var(--text-soft)">Turkiye</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;padding:10px 0">
        <span style="font-size:0.875rem;font-weight:500;color:var(--text);min-width:140px">atonota</span>
        <span class="badge" style="background:rgba(239,68,68,0.1);color:#ef4444;flex-shrink:0">founded-by</span>
        <span style="font-size:0.875rem;color:var(--text-soft)">Karaca</span>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('seo'));</script>
</body>
</html>
