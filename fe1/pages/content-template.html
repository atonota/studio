<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Icerik Sablonu Olusturucu — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="table" x-data="{
  keyword: '',
  generated: false,
  loading: false,
  serpAnalysis: 'Top 10 sonuc analiz edildi — ortalama icerik uzunlugu: 2,400 kelime',
  wordCount: 2400,
  readability: 'Kolay-Orta',
  semanticKeywords: [
    'dijital pazarlama stratejisi','seo optimizasyonu','organik trafik','anahtar kelime arastirmasi',
    'icerik pazarlama','backlink kazanma','teknik seo','sayfa ici optimizasyon',
    'kullanici deneyimi','mobil uyumluluk','sayfa hizi','schema markup',
    'dahili linkleme','meta etiketler','icerik takvimi'
  ],
  headings: [
    'Dijital Pazarlama Nedir ve Neden Onemlidir?',
    'SEO Stratejisi Nasil Olusturulur?',
    'Anahtar Kelime Arastirmasi: Adim Adim Rehber',
    'Icerik Olusturma En Iyi Uygulamalari',
    'Teknik SEO Kontrol Listesi',
    'Backlink Kazanma Stratejileri',
    'Sosyal Medya ve SEO Iliskisi',
    'Olcum ve Raporlama: KPI Takibi'
  ],
  backlinkTargets: [
    {site:'webrazzi.com',dr:78,reason:'Sektorde lider blog, konuk yazi firsati'},
    {site:'pazarlamasyon.com',dr:62,reason:'Dijital pazarlama odakli, icerik ortakligi'},
    {site:'dijitalajanslar.com',dr:55,reason:'Ajans rehberi, profil + link firsati'},
    {site:'startupturk.com',dr:48,reason:'Girisimcilik ekosistemi, vaka calismasi'},
    {site:'sosyalmedya.co',dr:44,reason:'Sosyal medya odakli, karsilikli link'}
  ],
  doGenerate() {
    if (!this.keyword.trim()) return;
    this.loading = true;
    this.generated = false;
    setTimeout(() => {
      this.loading = false;
      this.generated = true;
    }, 2500);
  }
}">
  <!-- Header -->
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">Icerik Sablonu Olusturucu</h1>
    <p class="page-sub">SERP analizine dayali, veri odakli icerik sablonlari olusturun</p>
  </div>

  <!-- Keyword Input -->
  <div class="fade-in-d1 card" style="padding:var(--sp-5);margin-bottom:var(--sp-6)">
    <div style="display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap">
      <div style="position:relative;flex:1;min-width:260px">
        <i class="ph ph-target" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)"></i>
        <input type="text" x-model="keyword" @keydown.enter="doGenerate()" placeholder="Hedef keyword girin..." style="width:100%;padding:var(--sp-3) var(--sp-3) var(--sp-3) 36px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-sm);outline:none;font-family:inherit">
      </div>
      <button @click="doGenerate()" class="btn-primary" :disabled="loading">
        <i class="ph" :class="loading ? 'ph-circle-notch' : 'ph-magic-wand'" :style="loading && 'animation:spin 1s linear infinite'"></i>
        <span x-text="loading ? 'Sablon olusturuluyor...' : 'Sablon Olustur'"></span>
      </button>
    </div>
  </div>

  <!-- Generated Template -->
  <template x-if="generated">
    <div>
      <!-- SERP Analysis Banner -->
      <div class="fade-in-d1" style="background:rgba(194,65,12,0.08);border:1px solid rgba(194,65,12,0.2);border-radius:var(--r-md);padding:var(--sp-4) var(--sp-5);margin-bottom:var(--sp-6);display:flex;align-items:center;gap:var(--sp-3)">
        <i class="ph ph-chart-pie" style="color:var(--accent);font-size:var(--fs-xl)"></i>
        <span style="font-size:var(--fs-sm);color:var(--text)" x-text="serpAnalysis"></span>
      </div>

      <!-- Recommendations Grid -->
      <div class="fade-in-d2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--sp-4);margin-bottom:var(--sp-6)">
        <div class="stat-card" style="--stripe:#3b82f6">
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Kelime Sayisi</span>
          <div style="font-size:var(--fs-2xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)" x-text="wordCount.toLocaleString('tr-TR')"></div>
          <span style="font-size:var(--fs-xs);color:var(--muted)">ort. top 10</span>
        </div>
        <div class="stat-card" style="--stripe:#22c55e">
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Readability</span>
          <div style="font-size:var(--fs-2xl);font-weight:300;color:#22c55e;margin-top:var(--sp-2)" x-text="readability"></div>
          <span style="font-size:var(--fs-xs);color:var(--muted)">onerilen seviye</span>
        </div>
        <div class="stat-card" style="--stripe:#a855f7">
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Semantik Kelime</span>
          <div style="font-size:var(--fs-2xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)" x-text="semanticKeywords.length"></div>
          <span style="font-size:var(--fs-xs);color:var(--muted)">iliskili keyword</span>
        </div>
        <div class="stat-card" style="--stripe:#eab308">
          <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">H2 Baslik</span>
          <div style="font-size:var(--fs-2xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)" x-text="headings.length"></div>
          <span style="font-size:var(--fs-xs);color:var(--muted)">onerilen baslik</span>
        </div>
      </div>

      <!-- Semantic Keywords -->
      <div class="fade-in-d2 card" style="margin-bottom:var(--sp-6);padding:var(--sp-5)">
        <span class="section-label">Semantik Kelimeler</span>
        <div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-2)">
          <template x-for="kw in semanticKeywords" :key="kw">
            <span class="badge" style="background:rgba(168,85,247,0.1);color:#a855f7;padding:var(--sp-2) var(--sp-3);font-size:var(--fs-sm)" x-text="kw"></span>
          </template>
        </div>
      </div>

      <!-- H2 Headings -->
      <div class="fade-in-d3 card" style="margin-bottom:var(--sp-6);padding:0;overflow:hidden">
        <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border)">
          <span class="section-label" style="margin-bottom:0">Onerilen H2 Basliklar</span>
        </div>
        <template x-for="(h, idx) in headings" :key="idx">
          <div :style="'padding:var(--sp-3) var(--sp-5);display:flex;align-items:center;gap:var(--sp-3);' + (idx < headings.length - 1 ? 'border-bottom:1px solid var(--border)' : '')">
            <span style="width:24px;height:24px;border-radius:var(--r-sm);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xs);font-weight:700;color:var(--accent);flex-shrink:0" x-text="idx+1"></span>
            <span style="font-size:var(--fs-sm);color:var(--text);font-weight:500" x-text="h"></span>
          </div>
        </template>
      </div>

      <!-- Backlink Targets -->
      <div class="fade-in-d3 card" style="margin-bottom:var(--sp-6);padding:0;overflow:hidden">
        <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border)">
          <span class="section-label" style="margin-bottom:0">Backlink Hedefleri</span>
        </div>
        <template x-for="(bt, idx) in backlinkTargets" :key="bt.site">
          <div :style="'padding:var(--sp-4) var(--sp-5);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-2);' + (idx < backlinkTargets.length - 1 ? 'border-bottom:1px solid var(--border)' : '')">
            <div style="flex:1;min-width:200px">
              <div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-1)">
                <span style="font-size:var(--fs-sm);color:var(--accent);font-weight:600" x-text="bt.site"></span>
                <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6" x-text="'DR '+bt.dr"></span>
              </div>
              <span style="font-size:var(--fs-sm);color:var(--muted)" x-text="bt.reason"></span>
            </div>
          </div>
        </template>
      </div>

      <!-- Action Button -->
      <div class="fade-in-d3" style="text-align:center;margin-bottom:var(--sp-6)">
        <a href="content-pages.html" class="btn-primary" style="text-decoration:none;font-size:var(--fs-sm);padding:var(--sp-3) var(--sp-6);display:inline-flex;align-items:center;gap:var(--sp-2)"><i class="ph ph-pencil-line"></i> Yazim Asistaninda Ac</a>
      </div>
    </div>
  </template>
</div>

<div id="footbar"></div>
<script src="../js/mock-data.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('content'));</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
