<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Webhook Yonetimi — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main">
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px">
    <div>
      <h1 class="page-title">Webhook Yonetimi</h1>
      <p class="page-sub">Dis servis entegrasyonlari</p>
    </div>
    <button class="btn-primary"><i class="ph ph-plus"></i> Yeni Webhook</button>
  </div>

  <div class="fade-in-d1" style="display:flex;flex-direction:column;gap:16px">
    <!-- Webhook 1: SEO Alert -->
    <div class="card" style="padding:20px 24px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="width:36px;height:36px;border-radius:8px;background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-webhooks-logo" style="color:#3b82f6;font-size:1.125rem"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">SEO Alert Webhook</div>
              <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;align-items:center;gap:8px;font-size:0.8125rem">
              <span style="color:var(--muted);font-weight:600;font-size:0.6875rem;width:56px">URL</span>
              <span style="color:var(--text-soft);font-family:monospace;font-size:0.75rem">https://hooks.slack.com/xxx</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;font-size:0.8125rem">
              <span style="color:var(--muted);font-weight:600;font-size:0.6875rem;width:56px">Events</span>
              <div style="display:flex;gap:6px">
                <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:0.6875rem;color:var(--text-soft);font-family:monospace">seo.anomaly</span>
                <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:0.6875rem;color:var(--text-soft);font-family:monospace">content.decay</span>
              </div>
            </div>
          </div>
        </div>
        <button class="btn-secondary" style="padding:8px 14px;font-size:0.8125rem"><i class="ph ph-play"></i> Test</button>
      </div>
    </div>

    <!-- Webhook 2: CRM Sync -->
    <div class="card" style="padding:20px 24px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="width:36px;height:36px;border-radius:8px;background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-webhooks-logo" style="color:#a855f7;font-size:1.125rem"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">CRM Sync</div>
              <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;align-items:center;gap:8px;font-size:0.8125rem">
              <span style="color:var(--muted);font-weight:600;font-size:0.6875rem;width:56px">URL</span>
              <span style="color:var(--text-soft);font-family:monospace;font-size:0.75rem">https://api.hubspot.com/xxx</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;font-size:0.8125rem">
              <span style="color:var(--muted);font-weight:600;font-size:0.6875rem;width:56px">Events</span>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:0.6875rem;color:var(--text-soft);font-family:monospace">tenant.create</span>
                <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:0.6875rem;color:var(--text-soft);font-family:monospace">workspace.create</span>
              </div>
            </div>
          </div>
        </div>
        <button class="btn-secondary" style="padding:8px 14px;font-size:0.8125rem"><i class="ph ph-play"></i> Test</button>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('settings'));</script>
</body>
</html>
