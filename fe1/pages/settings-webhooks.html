<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Webhook Yonetimi — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="form">
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-6)">
    <div>
      <h1 class="page-title">Webhook Yonetimi</h1>
      <p class="page-sub">Dis servis entegrasyonlari</p>
    </div>
    <button class="btn-primary"><i class="ph ph-plus"></i> Yeni Webhook</button>
  </div>

  <div class="fade-in-d1" style="display:flex;flex-direction:column;gap:var(--sp-4)">
    <!-- Webhook 1: SEO Alert -->
    <div class="card" style="padding:var(--sp-5) var(--sp-6)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)">
            <div style="width:36px;height:36px;border-radius:var(--r-md);background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-webhooks-logo" style="color:#3b82f6;font-size:var(--fs-lg)"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">SEO Alert Webhook</div>
              <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:var(--sp-2)">
            <div style="display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm)">
              <span style="color:var(--muted);font-weight:600;font-size:var(--fs-xs);width:56px">URL</span>
              <span style="color:var(--text-soft);font-family:monospace;font-size:var(--fs-sm)">https://hooks.slack.com/xxx</span>
            </div>
            <div style="display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm)">
              <span style="color:var(--muted);font-weight:600;font-size:var(--fs-xs);width:56px">Events</span>
              <div style="display:flex;gap:var(--sp-2)">
                <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px var(--sp-2);font-size:var(--fs-xs);color:var(--text-soft);font-family:monospace">seo.anomaly</span>
                <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px var(--sp-2);font-size:var(--fs-xs);color:var(--text-soft);font-family:monospace">content.decay</span>
              </div>
            </div>
          </div>
        </div>
        <button class="btn-secondary" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm)"><i class="ph ph-play"></i> Test</button>
      </div>
    </div>

    <!-- Webhook 2: CRM Sync -->
    <div class="card" style="padding:var(--sp-5) var(--sp-6)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)">
            <div style="width:36px;height:36px;border-radius:var(--r-md);background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-webhooks-logo" style="color:#a855f7;font-size:var(--fs-lg)"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">CRM Sync</div>
              <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:var(--sp-2)">
            <div style="display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm)">
              <span style="color:var(--muted);font-weight:600;font-size:var(--fs-xs);width:56px">URL</span>
              <span style="color:var(--text-soft);font-family:monospace;font-size:var(--fs-sm)">https://api.hubspot.com/xxx</span>
            </div>
            <div style="display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-sm)">
              <span style="color:var(--muted);font-weight:600;font-size:var(--fs-xs);width:56px">Events</span>
              <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">
                <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px var(--sp-2);font-size:var(--fs-xs);color:var(--text-soft);font-family:monospace">tenant.create</span>
                <span style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px var(--sp-2);font-size:var(--fs-xs);color:var(--text-soft);font-family:monospace">workspace.create</span>
              </div>
            </div>
          </div>
        </div>
        <button class="btn-secondary" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm)"><i class="ph ph-play"></i> Test</button>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('settings'));</script>
</body>
</html>
