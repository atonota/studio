<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sifre Sifirla — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/tokens.css">
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body class="dark" style="display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:auto">

  <div class="fade-in" x-data="form({password:'', confirmPassword:''})" style="width:100%;max-width:420px;margin:24px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:40px 32px">

    <!-- Logo -->
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px">
      <div style="width:40px;height:40px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center">
        <span style="font-weight:800;font-size:1.125rem;color:white">a</span>
      </div>
      <span style="font-size:1.25rem;font-weight:600;color:var(--text);letter-spacing:-0.02em">atonota</span>
    </div>
    <h2 style="text-align:center;font-size:1.25rem;font-weight:500;color:var(--text);margin-bottom:8px">Sifre Sifirla</h2>
    <p style="text-align:center;font-size:0.8125rem;color:var(--muted);margin-bottom:28px">Yeni sifrenizi belirleyin.</p>

    <!-- Form -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Yeni Sifre</label>
        <input type="password" placeholder="••••••••" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:inherit;outline:none;width:100%;font-size:0.875rem">
      </div>
      <div>
        <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Sifre Tekrar</label>
        <input type="password" placeholder="••••••••" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:inherit;outline:none;width:100%;font-size:0.875rem">
      </div>

      <button class="btn-primary" style="width:100%;justify-content:center;margin-top:8px;padding:12px 18px;font-size:0.9375rem">Sifreyi Guncelle</button>

      <div style="text-align:center;margin-top:8px">
        <a href="auth-login.html" style="font-size:0.8125rem;color:var(--accent);text-decoration:none;font-weight:500"><i class="ph ph-arrow-left" style="font-size:0.75rem;margin-right:4px"></i>Giris sayfasina don</a>
      </div>
    </div>
  </div>

</body>
</html>
