<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>AI Brand Radar — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="chat" x-data="{
  platforms: [
    {name:'ChatGPT',icon:'ph-openai-logo',color:'#22c55e',mentions:142,sentiment:'Pozitif',sentimentColor:'#22c55e',sentimentBg:'rgba(34,197,94,0.1)',lastMention:'2 saat once',trend:'up',trendColor:'#22c55e'},
    {name:'Gemini',icon:'ph-google-logo',color:'#3b82f6',mentions:87,sentiment:'Notr',sentimentColor:'#eab308',sentimentBg:'rgba(234,179,8,0.1)',lastMention:'5 saat once',trend:'up',trendColor:'#22c55e'},
    {name:'Perplexity',icon:'ph-compass',color:'#a855f7',mentions:63,sentiment:'Pozitif',sentimentColor:'#22c55e',sentimentBg:'rgba(34,197,94,0.1)',lastMention:'1 gun once',trend:'down',trendColor:'#ef4444'},
    {name:'Claude',icon:'ph-brain',color:'#C2410C',mentions:51,sentiment:'Pozitif',sentimentColor:'#22c55e',sentimentBg:'rgba(34,197,94,0.1)',lastMention:'3 saat once',trend:'up',trendColor:'#22c55e'},
    {name:'Copilot',icon:'ph-microsoft-outlook-logo',color:'#3b82f6',mentions:38,sentiment:'Notr',sentimentColor:'#eab308',sentimentBg:'rgba(234,179,8,0.1)',lastMention:'2 gun once',trend:'stable',trendColor:'var(--muted)'},
    {name:'Grok',icon:'ph-x-logo',color:'var(--text)',mentions:24,sentiment:'Negatif',sentimentColor:'#ef4444',sentimentBg:'rgba(239,68,68,0.1)',lastMention:'4 gun once',trend:'down',trendColor:'#ef4444'}
  ],
  platformSort: 'desc',
  get sortedPlatforms() {
    return [...this.platforms].sort((a,b) => this.platformSort === 'desc' ? b.mentions - a.mentions : a.mentions - b.mentions);
  },
  togglePlatformSort() {
    this.platformSort = this.platformSort === 'desc' ? 'asc' : 'desc';
  },
  exportBrandCSV() {
    const headers = ['Platform','Bahsedilme','Duygu','Son Bahsedilme','Trend'];
    const rows = this.sortedPlatforms.map(p => [p.name, p.mentions, p.sentiment, p.lastMention, p.trend]);
    exportToCSV(headers, rows, 'ai-brand-radar.csv');
  },
  showPromptModal: false,
  newPrompt: '',
  trackedPrompts: [
    {prompt:'en iyi dijital pazarlama araci nedir',status:'Bahsedildi',statusColor:'#22c55e',statusBg:'rgba(34,197,94,0.1)',platforms:4},
    {prompt:'turkiyede seo yazilimi onerileri',status:'Bahsedildi',statusColor:'#22c55e',statusBg:'rgba(34,197,94,0.1)',platforms:3},
    {prompt:'reklam butce optimizasyon araci',status:'Bahsedilmedi',statusColor:'#ef4444',statusBg:'rgba(239,68,68,0.1)',platforms:0},
    {prompt:'web analitiği platformu karsilastirma',status:'Bahsedildi',statusColor:'#22c55e',statusBg:'rgba(34,197,94,0.1)',platforms:2},
    {prompt:'e-ticaret seo araci 2026',status:'Bahsedilmedi',statusColor:'#ef4444',statusBg:'rgba(239,68,68,0.1)',platforms:0}
  ],
  addPrompt() {
    if (!this.newPrompt.trim()) return;
    this.trackedPrompts.push({
      prompt: this.newPrompt.trim(),
      status: 'Bekliyor',
      statusColor: 'var(--muted)',
      statusBg: 'var(--surface-2)',
      platforms: 0
    });
    this.newPrompt = '';
    this.showPromptModal = false;
  },
  removePrompt(idx) { this.trackedPrompts.splice(idx, 1); }
}">
  <!-- Header -->
  <div class="fade-in" style="margin-bottom:var(--sp-6);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3)">
    <div>
      <h1 class="page-title">AI Brand Radar</h1>
      <p class="page-sub">Markanizin AI platformlarindaki gorunurlugunu takip edin</p>
    </div>
    <div style="display:flex;gap:var(--sp-2)">
      <button @click="togglePlatformSort()" style="padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:var(--sp-2)">
        <i class="ph" :class="platformSort==='desc' ? 'ph-sort-descending' : 'ph-sort-ascending'" style="font-size:var(--fs-md)"></i> Bahsedilme Sirala
      </button>
      <button @click="exportBrandCSV()" style="padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:var(--sp-2)">
        <i class="ph ph-download-simple" style="font-size:var(--fs-md)"></i> Rapor Indir (CSV)
      </button>
    </div>
  </div>

  <!-- Platform Cards -->
  <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp-4);margin-bottom:var(--sp-6)">
    <template x-for="p in sortedPlatforms" :key="p.name">
      <div class="card" style="padding:var(--sp-5)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4)">
          <div style="display:flex;align-items:center;gap:var(--sp-3)">
            <div :style="'width:36px;height:36px;border-radius:var(--r-md);background:'+p.color+'1a;display:flex;align-items:center;justify-content:center'">
              <i class="ph" :class="p.icon" :style="'color:'+p.color+';font-size:var(--fs-lg)'"></i>
            </div>
            <span style="font-weight:600;color:var(--text);font-size:var(--fs-base)" x-text="p.name"></span>
          </div>
          <i class="ph" :class="p.trend==='up' ? 'ph-trend-up' : p.trend==='down' ? 'ph-trend-down' : 'ph-minus'" :style="'color:'+p.trendColor+';font-size:var(--fs-xl)'"></i>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)">
          <div>
            <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase">Bahsedilme</span>
            <div style="font-size:var(--fs-xl);font-weight:300;color:var(--text);margin-top:var(--sp-1)" x-text="p.mentions"></div>
          </div>
          <div>
            <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase">Duygu</span>
            <div style="margin-top:var(--sp-1)"><span class="badge" :style="'background:'+p.sentimentBg+';color:'+p.sentimentColor" x-text="p.sentiment"></span></div>
          </div>
        </div>
        <div style="margin-top:var(--sp-3);padding-top:var(--sp-3);border-top:1px solid var(--border)">
          <span style="font-size:var(--fs-xs);color:var(--muted)">Son bahsedilme: <span :style="'color:var(--text)'" x-text="p.lastMention"></span></span>
        </div>
      </div>
    </template>
  </div>

  <!-- Mention Trend Chart -->
  <div class="fade-in-d2 card" style="margin-bottom:var(--sp-6)">
    <span class="section-label">Haftalik Bahsedilme Trendi (12 Hafta)</span>
    <div id="chart-mention-trend" style="width:100%;height:320px"></div>
  </div>

  <!-- Share of Voice Donut -->
  <div class="fade-in-d3" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5);margin-bottom:var(--sp-6)">
    <div class="card">
      <span class="section-label">Share of Voice</span>
      <div id="chart-sov" style="width:100%;height:280px"></div>
    </div>

    <!-- Tracked Prompts -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <span class="section-label" style="margin-bottom:0">Takip Edilen Promptlar</span>
        <button @click="showPromptModal = true" style="font-size:var(--fs-xs);padding:var(--sp-1) var(--sp-3);border-radius:var(--r-sm);border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-family:inherit;font-weight:600"><i class="ph ph-plus"></i> Prompt Ekle</button>
      </div>
      <div style="max-height:300px;overflow-y:auto">
        <template x-for="(pr, idx) in trackedPrompts" :key="idx">
          <div :style="'padding:var(--sp-3) var(--sp-5);' + (idx < trackedPrompts.length - 1 ? 'border-bottom:1px solid var(--border)' : '')">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)">
              <span style="font-size:var(--fs-sm);color:var(--text);flex:1" x-text="pr.prompt"></span>
              <span class="badge" :style="'background:'+pr.statusBg+';color:'+pr.statusColor+';white-space:nowrap'" x-text="pr.status"></span>
              <button @click="removePrompt(idx)" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:var(--fs-md);padding:2px"><i class="ph ph-x"></i></button>
            </div>
            <span x-show="pr.platforms > 0" style="font-size:var(--fs-xs);color:var(--muted);margin-top:var(--sp-1);display:block" x-text="pr.platforms + ' platformda bahsedildi'"></span>
          </div>
        </template>
      </div>
    </div>
  </div>

  <!-- Add Prompt Modal -->
  <div x-show="showPromptModal" x-transition.opacity class="ap-confirm-backdrop" style="z-index:1000;padding:var(--sp-5)" @click.self="showPromptModal=false" x-cloak>
    <div style="background:var(--color-glass-panel);backdrop-filter:blur(var(--blur-level)) saturate(1.4);-webkit-backdrop-filter:blur(var(--blur-level)) saturate(1.4);border:1px solid var(--glass-border);border-radius:16px;width:100%;max-width:480px;padding:var(--sp-6);box-shadow:0 24px 64px rgba(0,0,0,0.4)" @click.stop>
      <h3 style="font-size:var(--fs-lg);font-weight:600;color:var(--text);margin-bottom:var(--sp-4)">Yeni Prompt Ekle</h3>
      <input type="text" x-model="newPrompt" @keydown.enter="addPrompt()" placeholder="Takip edilecek prompt girin..." style="width:100%;padding:var(--sp-3) var(--sp-3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-sm);outline:none;font-family:inherit;margin-bottom:var(--sp-4)">
      <div style="display:flex;gap:var(--sp-2);justify-content:flex-end">
        <button @click="showPromptModal=false" style="padding:var(--sp-2) var(--sp-4);border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--muted);cursor:pointer;font-family:inherit;font-size:var(--fs-sm)">Iptal</button>
        <button @click="addPrompt()" class="btn-primary" style="font-size:var(--fs-sm)">Ekle</button>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/mock-data.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('ai'));</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const t = getChartTheme();
  const weeks = ['H1','H2','H3','H4','H5','H6','H7','H8','H9','H10','H11','H12'];
  const genData = (base, variance) => weeks.map(() => Math.floor(base + Math.random()*variance));

  // Mention Trend
  const trend = echarts.init(document.getElementById('chart-mention-trend'));
  trend.setOption({
    tooltip: { ...t.tooltip, trigger: 'axis' },
    legend: { data: ['ChatGPT','Gemini','Perplexity','Claude','Copilot','Grok'], textStyle: { color: t.muted, fontSize: 10 }, top: 0 },
    grid: { left: 48, right: 16, top: 40, bottom: 32 },
    xAxis: { type: 'category', data: weeks, axisLine: { lineStyle: { color: t.border } }, axisLabel: { color: t.muted, fontSize: 10 } },
    yAxis: { type: 'value', splitLine: { lineStyle: { color: t.border, type: 'dashed' } }, axisLabel: { color: t.muted, fontSize: 10 } },
    series: [
      { name: 'ChatGPT', type: 'line', data: genData(10, 8), smooth: true, symbol: 'none', lineStyle: { color: '#22c55e', width: 2 }, itemStyle: { color: '#22c55e' } },
      { name: 'Gemini', type: 'line', data: genData(6, 6), smooth: true, symbol: 'none', lineStyle: { color: '#3b82f6', width: 2 }, itemStyle: { color: '#3b82f6' } },
      { name: 'Perplexity', type: 'line', data: genData(4, 5), smooth: true, symbol: 'none', lineStyle: { color: '#a855f7', width: 2 }, itemStyle: { color: '#a855f7' } },
      { name: 'Claude', type: 'line', data: genData(3, 4), smooth: true, symbol: 'none', lineStyle: { color: '#C2410C', width: 2 }, itemStyle: { color: '#C2410C' } },
      { name: 'Copilot', type: 'line', data: genData(2, 3), smooth: true, symbol: 'none', lineStyle: { color: '#06b6d4', width: 2 }, itemStyle: { color: '#06b6d4' } },
      { name: 'Grok', type: 'line', data: genData(1, 3), smooth: true, symbol: 'none', lineStyle: { color: '#7B7269', width: 2 }, itemStyle: { color: '#7B7269' } },
    ]
  });

  // Share of Voice Donut
  const sov = echarts.init(document.getElementById('chart-sov'));
  sov.setOption({
    tooltip: { ...t.tooltip, trigger: 'item', formatter: '{b}: {d}%' },
    series: [{
      type: 'pie',
      radius: ['45%', '70%'],
      center: ['50%', '50%'],
      avoidLabelOverlap: true,
      label: { color: t.text, fontSize: 11 },
      labelLine: { lineStyle: { color: t.border } },
      data: [
        { value: 35, name: 'Siz (acme)', itemStyle: { color: '#C2410C' } },
        { value: 25, name: 'Rakip A', itemStyle: { color: '#3b82f6' } },
        { value: 20, name: 'Rakip B', itemStyle: { color: '#a855f7' } },
        { value: 12, name: 'Rakip C', itemStyle: { color: '#eab308' } },
        { value: 8, name: 'Diger', itemStyle: { color: '#7B7269' } },
      ]
    }]
  });

  window.addEventListener('resize', () => { trend.resize(); sov.resize(); });
});
</script>
</body>
</html>
