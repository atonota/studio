<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Yerel Rehberler — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div><div id="spotlight-backdrop"></div><div id="ud-backdrop"></div>
<nav id="rail" role="navigation"></nav><div id="wide-overlay"></div><div id="sidebar-wide"></div>

<div id="main" data-skeleton="table" x-data="{ statusFilter:'tumu' }">
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">Yerel Rehberler</h1>
    <p class="page-sub">Dizin listeleme durumu ve NAP tutarliligi</p>
  </div>

  <div class="fade-in-d1 card" data-paginate="10" style="padding:0;overflow:hidden">
    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span class="section-label" style="margin-bottom:0">Rehber Listesi</span>
      <button onclick="if(window.exportToCSV)exportToCSV(['Rehber','Listeleme Durumu','NAP Tutarliligi'], document.querySelectorAll('#main table tbody tr'))" class="btn-secondary" style="font-size:var(--fs-sm);gap:var(--sp-1);padding:var(--sp-2) var(--sp-3);"><i class="ph ph-download-simple"></i>CSV</button>
    </div>
    <table class="r-table">
      <thead>
        <tr>
          <th>Rehber</th>
          <th>Listeleme Durumu</th>
          <th>NAP Tutarliligi</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td data-label="Rehber"><span style="font-weight:500;color:var(--text)">Google Business Profile</span></td>
          <td data-label="Listeleme Durumu"><span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span></td>
          <td data-label="NAP Tutarliligi"><span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Tutarli</span></td>
        </tr>
        <tr>
          <td data-label="Rehber"><span style="font-weight:500;color:var(--text)">Yandex Business</span></td>
          <td data-label="Listeleme Durumu"><span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span></td>
          <td data-label="NAP Tutarliligi"><span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Tutarli</span></td>
        </tr>
        <tr>
          <td data-label="Rehber"><span style="font-weight:500;color:var(--text)">Foursquare</span></td>
          <td data-label="Listeleme Durumu"><span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span></td>
          <td data-label="NAP Tutarliligi"><span class="badge" style="background:rgba(234,179,8,0.1);color:#eab308">Guncellemeli</span></td>
        </tr>
        <tr>
          <td data-label="Rehber"><span style="font-weight:500;color:var(--text)">Enuygun</span></td>
          <td data-label="Listeleme Durumu"><span class="badge" style="background:rgba(239,68,68,0.1);color:#ef4444">Eksik</span></td>
          <td data-label="NAP Tutarliligi"><span style="font-size:var(--fs-sm);color:var(--muted)">—</span></td>
        </tr>
        <tr>
          <td data-label="Rehber"><span style="font-weight:500;color:var(--text)">Sahibinden</span></td>
          <td data-label="Listeleme Durumu"><span class="badge" style="background:rgba(234,179,8,0.1);color:#eab308">Guncellemeli</span></td>
          <td data-label="NAP Tutarliligi"><span class="badge" style="background:rgba(234,179,8,0.1);color:#eab308">Guncellemeli</span></td>
        </tr>
        <tr>
          <td data-label="Rehber"><span style="font-weight:500;color:var(--text)">Sikayetvar</span></td>
          <td data-label="Listeleme Durumu"><span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span></td>
          <td data-label="NAP Tutarliligi"><span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Tutarli</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/mock-data.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('seo'));</script>
</body>
</html>
