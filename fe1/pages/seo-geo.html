<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GEO — AI Gorunurluk — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/tokens.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main" x-data="{ platform: 'tumu', range: '30' }">
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 class="page-title">GEO — AI Gorunurluk</h1>
      <p class="page-sub">Generative Engine Optimization izleme</p>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <div style="display:flex;gap:4px">
        <template x-for="p in [{v:'tumu',l:'Tumu'},{v:'ChatGPT',l:'ChatGPT'},{v:'Gemini',l:'Gemini'},{v:'Perplexity',l:'Perplexity'},{v:'Claude',l:'Claude'}]">
          <button @click="platform = p.v" :style="platform === p.v ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : 'background:var(--surface-2);color:var(--muted)'" style="padding:6px 12px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:all .15s" x-text="p.l"></button>
        </template>
      </div>
      <div style="display:flex;gap:4px">
        <template x-for="r in [{v:'7',l:'7 Gun'},{v:'30',l:'30 Gun'},{v:'90',l:'90 Gun'}]">
          <button @click="range = r.v" :style="range === r.v ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : 'background:var(--surface-2);color:var(--muted)'" style="padding:6px 14px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:all .15s" x-text="r.l"></button>
        </template>
      </div>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
    <div class="stat-card" style="--stripe:#a855f7">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">AI Mention</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">23</div>
    </div>
    <div class="stat-card" style="--stripe:#3b82f6">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Citation</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">8</div>
    </div>
    <div class="stat-card" style="--stripe:#22c55e">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Platform</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">4<span style="font-size:1rem;color:var(--muted);font-weight:300">/6</span></div>
    </div>
    <div class="stat-card" style="--stripe:#C2410C">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Citability Skoru</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--accent);margin-top:8px">72<span style="font-size:1rem;color:var(--muted);font-weight:300">/100</span></div>
    </div>
  </div>

  <!-- Platform Cards -->
  <div class="fade-in-d2" style="margin-bottom:24px">
    <span class="section-label">AI Platformlari</span>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
      <!-- ChatGPT -->
      <div class="card" style="display:flex;align-items:center;gap:14px">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(34,197,94,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="ph ph-openai-logo" style="font-size:1.25rem;color:#22c55e"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:500;color:var(--text);font-size:0.875rem">ChatGPT</div>
          <div style="font-size:0.75rem;color:var(--muted);margin-top:2px">8 mention</div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span>
      </div>
      <!-- Gemini -->
      <div class="card" style="display:flex;align-items:center;gap:14px">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="ph ph-google-logo" style="font-size:1.25rem;color:#3b82f6"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:500;color:var(--text);font-size:0.875rem">Gemini</div>
          <div style="font-size:0.75rem;color:var(--muted);margin-top:2px">6 mention</div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span>
      </div>
      <!-- Perplexity -->
      <div class="card" style="display:flex;align-items:center;gap:14px">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="ph ph-compass" style="font-size:1.25rem;color:#a855f7"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:500;color:var(--text);font-size:0.875rem">Perplexity</div>
          <div style="font-size:0.75rem;color:var(--muted);margin-top:2px">5 mention</div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span>
      </div>
      <!-- Claude -->
      <div class="card" style="display:flex;align-items:center;gap:14px">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(194,65,12,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="ph ph-robot" style="font-size:1.25rem;color:#C2410C"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:500;color:var(--text);font-size:0.875rem">Claude</div>
          <div style="font-size:0.75rem;color:var(--muted);margin-top:2px">3 mention</div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Aktif</span>
      </div>
      <!-- Copilot -->
      <div class="card" style="display:flex;align-items:center;gap:14px">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(123,114,105,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="ph ph-microsoft-teams-logo" style="font-size:1.25rem;color:#7B7269"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:500;color:var(--text);font-size:0.875rem">Copilot</div>
          <div style="font-size:0.75rem;color:var(--muted);margin-top:2px">1 mention</div>
        </div>
        <span class="badge" style="background:rgba(123,114,105,0.15);color:#7B7269">Pasif</span>
      </div>
      <!-- Grok -->
      <div class="card" style="display:flex;align-items:center;gap:14px">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(123,114,105,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <i class="ph ph-x-logo" style="font-size:1.25rem;color:#7B7269"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:500;color:var(--text);font-size:0.875rem">Grok</div>
          <div style="font-size:0.75rem;color:var(--muted);margin-top:2px">0 mention</div>
        </div>
        <span class="badge" style="background:rgba(123,114,105,0.15);color:#7B7269">Pasif</span>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('seo'));</script>
</body>
</html>
