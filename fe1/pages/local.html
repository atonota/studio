<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Local SEO — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div><div id="spotlight-backdrop"></div><div id="ud-backdrop"></div>
<nav id="rail" role="navigation"></nav><div id="wide-overlay"></div><div id="sidebar-wide" class="open"></div>

<div id="main" x-data="{ expanded:null }">
  <div class="fade-in" style="margin-bottom:24px">
    <h1 class="page-title">Local SEO</h1>
    <p class="page-sub">Yerel arama optimizasyonu ve konum yonetimi</p>
  </div>

  <!-- Stat Cards -->
  <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
    <div class="stat-card" style="--stripe:#a855f7">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Konum</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">3</div>
    </div>
    <div class="stat-card" style="--stripe:#22c55e">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">GBP Skoru</span>
      <div style="font-size:1.75rem;font-weight:300;color:#22c55e;margin-top:8px">82<span style="font-size:0.875rem;color:var(--muted)">/100</span></div>
    </div>
    <div class="stat-card" style="--stripe:#3b82f6">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Yerel Siralama Ort</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">4.2</div>
    </div>
    <div class="stat-card" style="--stripe:#eab308">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Yorum</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">128</div>
    </div>
  </div>

  <!-- Location Cards -->
  <div class="fade-in-d2" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
    <!-- Istanbul -->
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(34,197,94,0.1);display:flex;align-items:center;justify-content:center">
          <i class="ph ph-map-pin" style="font-size:1.25rem;color:#22c55e"></i>
        </div>
        <div>
          <div style="font-weight:500;color:var(--text)">Istanbul Merkez</div>
          <div style="font-size:0.6875rem;color:var(--muted)">Besiktas, Istanbul</div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e;margin-left:auto">Aktif</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)">
        <span style="font-size:0.75rem;color:var(--muted)">GBP Skoru</span>
        <span style="font-weight:500;color:#22c55e">88/100</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)">
        <span style="font-size:0.75rem;color:var(--muted)">Yorum</span>
        <span style="font-weight:500;color:var(--text)">72</span>
      </div>
    </div>

    <!-- Ankara -->
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(34,197,94,0.1);display:flex;align-items:center;justify-content:center">
          <i class="ph ph-map-pin" style="font-size:1.25rem;color:#22c55e"></i>
        </div>
        <div>
          <div style="font-weight:500;color:var(--text)">Ankara</div>
          <div style="font-size:0.6875rem;color:var(--muted)">Cankaya, Ankara</div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e;margin-left:auto">Aktif</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)">
        <span style="font-size:0.75rem;color:var(--muted)">GBP Skoru</span>
        <span style="font-weight:500;color:#eab308">76/100</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)">
        <span style="font-size:0.75rem;color:var(--muted)">Yorum</span>
        <span style="font-weight:500;color:var(--text)">38</span>
      </div>
    </div>

    <!-- Izmir -->
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <div style="width:40px;height:40px;border-radius:10px;background:rgba(234,179,8,0.1);display:flex;align-items:center;justify-content:center">
          <i class="ph ph-map-pin" style="font-size:1.25rem;color:#eab308"></i>
        </div>
        <div>
          <div style="font-weight:500;color:var(--text)">Izmir</div>
          <div style="font-size:0.6875rem;color:var(--muted)">Alsancak, Izmir</div>
        </div>
        <span class="badge" style="background:rgba(234,179,8,0.1);color:#eab308;margin-left:auto">Kurulum</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)">
        <span style="font-size:0.75rem;color:var(--muted)">GBP Skoru</span>
        <span style="font-weight:500;color:var(--muted)">—</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border)">
        <span style="font-size:0.75rem;color:var(--muted)">Yorum</span>
        <span style="font-weight:500;color:var(--text)">18</span>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('seo'));</script>
</body>
</html>
