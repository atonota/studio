<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>On-Page SEO Denetimi — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="tool" x-data="{
  url: '',
  checked: false,
  loading: false,
  overallScore: 78,
  categories: [
    {name:'Strateji',score:85,icon:'ph-strategy',color:'#22c55e',open:false,items:[
      {status:'pass',text:'Hedef keyword title tag icerisinde mevcut',fix:''},
      {status:'pass',text:'Meta description 150-160 karakter arasinda',fix:''},
      {status:'warning',text:'H1 tag keyword ile baslamiyor',fix:'H1 tag basinda hedef keyword kullanin'},
      {status:'pass',text:'URL yapisi SEO uyumlu (kisa ve aciklayici)',fix:''},
      {status:'pass',text:'Internal linking yapisi yeterli (8 link)',fix:''}
    ]},
    {name:'Backlink',score:62,icon:'ph-link',color:'#eab308',open:false,items:[
      {status:'warning',text:'Referring domain sayisi dusuk (12)',fix:'Konuk yazilar ve PR ile backlink sayisini artirin'},
      {status:'fail',text:'Rakiplere gore %40 daha az backlink',fix:'Rekabetci backlink gap analizini inceleyin'},
      {status:'pass',text:'Toksik backlink orani kabul edilebilir (%3)',fix:''},
      {status:'warning',text:'Anchor text cesitliligi dusuk',fix:'Farkli anchor text varyasyonlari kullanin'}
    ]},
    {name:'Teknik',score:90,icon:'ph-gear',color:'#22c55e',open:false,items:[
      {status:'pass',text:'Canonical tag dogru tanimlanmis',fix:''},
      {status:'pass',text:'Robots.txt erisime acik',fix:''},
      {status:'pass',text:'Sitemap.xml mevcut ve guncel',fix:''},
      {status:'pass',text:'HTTPS aktif ve redirect dogru',fix:''},
      {status:'warning',text:'Hreflang tag eksik (cok dilli site)',fix:'Farkli dil versiyonlari icin hreflang tag ekleyin'}
    ]},
    {name:'Icerik',score:78,icon:'ph-article',color:'#3b82f6',open:false,items:[
      {status:'pass',text:'Icerik uzunlugu yeterli (2,400+ kelime)',fix:''},
      {status:'warning',text:'Gorsel alt text eksik (3/12 gorsel)',fix:'Tum gorsellere aciklayici alt text ekleyin'},
      {status:'pass',text:'Readability skoru iyi (Flesch 62)',fix:''},
      {status:'fail',text:'Schema markup eksik',fix:'Article veya FAQ schema markup ekleyin'},
      {status:'pass',text:'Keyword yogunlugu uygun (%1.8)',fix:''}
    ]},
    {name:'UX',score:82,icon:'ph-devices',color:'#a855f7',open:false,items:[
      {status:'pass',text:'Mobil uyumluluk testi gecti',fix:''},
      {status:'pass',text:'Core Web Vitals: LCP 1.8s (iyi)',fix:''},
      {status:'warning',text:'Core Web Vitals: CLS 0.12 (iyilestirilebilir)',fix:'Gorsel boyutlarini explicit tanimlayin'},
      {status:'pass',text:'Sayfa yukleme suresi 2.1s',fix:''}
    ]}
  ],
  doCheck() {
    if (!this.url.trim()) return;
    this.loading = true;
    this.checked = false;
    setTimeout(() => {
      this.loading = false;
      this.checked = true;
      setTimeout(() => {
        this.initGauge();
      }, 100);
    }, 2000);
  },
  getScoreColor(s) { return s >= 80 ? '#22c55e' : s >= 60 ? '#eab308' : '#ef4444'; },
  getStatusIcon(s) { return s === 'pass' ? 'ph-check-circle' : s === 'warning' ? 'ph-warning-circle' : 'ph-x-circle'; },
  getStatusColor(s) { return s === 'pass' ? '#22c55e' : s === 'warning' ? '#eab308' : '#ef4444'; },
  initGauge() {
    const el = document.getElementById('chart-overall');
    if (!el) return;
    const t = getChartTheme();
    const c = echarts.init(el);
    c.setOption({
      series: [{
        type: 'gauge',
        startAngle: 200,
        endAngle: -20,
        min: 0,
        max: 100,
        pointer: { show: true, length: '55%', width: 4, itemStyle: { color: this.getScoreColor(this.overallScore) } },
        axisLine: { lineStyle: { width: 18, color: [[0.6,'#ef4444'],[0.8,'#eab308'],[1,'#22c55e']] } },
        axisTick: { show: false },
        splitLine: { show: false },
        axisLabel: { color: t.muted, fontSize: 10, distance: 24 },
        detail: { formatter: '{value}/100', fontSize: 22, color: this.getScoreColor(this.overallScore), offsetCenter: [0, '40%'] },
        data: [{ value: this.overallScore }],
        title: { show: false }
      }]
    });
    window._onpageGauge = c;
    window.addEventListener('resize', () => c.resize());
  }
}">
  <!-- Header -->
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">On-Page SEO Denetimi</h1>
    <p class="page-sub">Tek sayfa bazinda detayli SEO analizi</p>
  </div>

  <!-- URL Input -->
  <div class="fade-in-d1 card" style="padding:var(--sp-5);margin-bottom:var(--sp-6)">
    <div style="display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap">
      <div style="position:relative;flex:1;min-width:260px">
        <i class="ph ph-globe" style="position:absolute;left:var(--sp-3);top:50%;transform:translateY(-50%);color:var(--muted)"></i>
        <input type="text" x-model="url" @keydown.enter="doCheck()" placeholder="Sayfa URL'si girin..." style="width:100%;padding:var(--sp-3) var(--sp-3) var(--sp-3) 36px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-sm);outline:none;font-family:inherit">
      </div>
      <button @click="doCheck()" class="btn-primary" :disabled="loading">
        <i class="ph" :class="loading ? 'ph-circle-notch' : 'ph-magnifying-glass'" :style="loading && 'animation:spin 1s linear infinite'"></i>
        <span x-text="loading ? 'Denetleniyor...' : 'Denetle'"></span>
      </button>
    </div>
  </div>

  <!-- Results -->
  <template x-if="checked">
    <div>
      <!-- Overall Score Gauge -->
      <div class="fade-in-d1 card" style="margin-bottom:var(--sp-6);text-align:center;padding:var(--sp-6)">
        <span class="section-label">Genel SEO Skoru</span>
        <div id="chart-overall" style="width:100%;height:220px"></div>
      </div>

      <!-- Category Cards -->
      <div class="fade-in-d2" style="display:grid;grid-template-columns:repeat(5,1fr);gap:var(--sp-3);margin-bottom:var(--sp-6)">
        <template x-for="cat in categories" :key="cat.name">
          <div class="stat-card" :style="'--stripe:'+cat.color+';cursor:pointer'" @click="cat.open = !cat.open">
            <div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2)">
              <i class="ph" :class="cat.icon" :style="'color:'+cat.color+';font-size:var(--fs-lg)'"></i>
              <span style="font-size:var(--fs-xs);color:var(--muted);font-weight:600;text-transform:uppercase" x-text="cat.name"></span>
            </div>
            <div :style="'font-size:var(--fs-2xl);font-weight:300;color:'+getScoreColor(cat.score)" x-text="cat.score + '/100'"></div>
          </div>
        </template>
      </div>

      <!-- Category Accordions -->
      <div class="fade-in-d3" style="display:flex;flex-direction:column;gap:var(--sp-3);margin-bottom:var(--sp-6)">
        <template x-for="cat in categories" :key="'acc-'+cat.name">
          <div class="card" style="padding:0;overflow:hidden">
            <div @click="cat.open = !cat.open" style="padding:var(--sp-4) var(--sp-5);cursor:pointer;display:flex;align-items:center;justify-content:space-between">
              <div style="display:flex;align-items:center;gap:var(--sp-3)">
                <i class="ph" :class="cat.icon" :style="'color:'+cat.color+';font-size:var(--fs-lg)'"></i>
                <span style="font-weight:600;color:var(--text);font-size:var(--fs-base)" x-text="cat.name"></span>
                <span :style="'font-size:var(--fs-sm);font-weight:600;color:'+getScoreColor(cat.score)" x-text="cat.score + '/100'"></span>
              </div>
              <i class="ph" :class="cat.open ? 'ph-caret-up' : 'ph-caret-down'" style="color:var(--muted)"></i>
            </div>
            <div x-show="cat.open" x-transition>
              <template x-for="(item, idx) in cat.items" :key="idx">
                <div :style="'padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--border);display:flex;align-items:flex-start;gap:var(--sp-3)'">
                  <i class="ph" :class="getStatusIcon(item.status)" :style="'color:'+getStatusColor(item.status)+';font-size:var(--fs-lg);margin-top:1px;flex-shrink:0'"></i>
                  <div style="flex:1">
                    <span style="font-size:var(--fs-sm);color:var(--text)" x-text="item.text"></span>
                    <div x-show="item.fix" style="margin-top:var(--sp-1);font-size:var(--fs-sm);color:var(--muted);display:flex;align-items:center;gap:var(--sp-1)">
                      <i class="ph ph-lightbulb" style="color:var(--accent)"></i>
                      <span x-text="item.fix"></span>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>

      <!-- Download Button -->
      <div class="fade-in-d3" style="text-align:center;margin-bottom:var(--sp-6)">
        <button class="btn-primary" style="font-size:var(--fs-sm);padding:var(--sp-3) var(--sp-6)"><i class="ph ph-file-pdf"></i> Tum Onerileri Indir (PDF)</button>
      </div>
    </div>
  </template>
</div>

<div id="footbar"></div>
<script src="../js/mock-data.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('seo'));</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
