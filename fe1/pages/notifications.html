<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bildirimler — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script src="../js/components.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="cards" x-data="notificationsPage()">
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-6)">
    <div>
      <h1 class="page-title">Bildirimler</h1>
      <p class="page-sub">Platform uyarilari ve bilgilendirmeler</p>
    </div>
    <div style="display:flex;gap:var(--sp-2);align-items:center">
      <a href="notification-rules.html" style="color:var(--accent);font-size:var(--fs-sm);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:var(--sp-1);padding:var(--sp-2) var(--sp-4);border:1px solid var(--accent);border-radius:var(--r-md);background:var(--accent-soft)">
        <i class="ph ph-gear" style="font-size:var(--fs-md)"></i> Kural Yonet <i class="ph ph-arrow-right" style="font-size:var(--fs-sm)"></i>
      </a>
      <button class="btn-secondary" @click="markAllRead()"><i class="ph ph-checks"></i> Tumunu Okundu</button>
    </div>
  </div>

  <!-- Filter Pills -->
  <div class="fade-in-d1" style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-5);flex-wrap:wrap">
    <template x-for="f in filters" :key="f">
      <button @click="filter = f"
        class="pill" :class="filter === f ? 'active' : ''" x-text="f"></button>
    </template>
  </div>

  <div class="fade-in-d1" style="display:flex;flex-direction:column;gap:var(--sp-3)">
    <template x-for="n in getFiltered()" :key="n.id">
      <div class="card" :style="'border-left:3px solid '+n.borderColor+';padding:var(--sp-4) var(--sp-5);'+(n.read ? 'opacity:0.6' : '')">
        <div style="display:flex;align-items:flex-start;gap:var(--sp-3)">
          <div :style="'width:36px;height:36px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:'+n.iconBg">
            <i class="ph" :class="n.icon" :style="'color:'+n.iconColor+';font-size:var(--fs-lg)'"></i>
          </div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-1);flex-wrap:wrap">
              <span style="font-weight:500;color:var(--text)" x-text="n.title"></span>
              <span class="badge" :style="'background:'+n.badgeBg+';color:'+n.badgeColor" x-text="n.badge"></span>
            </div>
            <p style="font-size:var(--fs-sm);color:var(--text-soft);margin-bottom:var(--sp-2);line-height:1.6" x-text="n.desc"></p>
            <div style="display:flex;align-items:center;gap:var(--sp-3)">
              <span style="font-size:var(--fs-xs);color:var(--muted)" x-text="n.time + (n.read ? ' — Okundu' : '')"></span>
              <button x-show="!n.read" @click="n.read = true; showToast && showToast('Okundu olarak isaretlendi')" style="font-size:var(--fs-xs);color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit;padding:0">Okundu Isaretle</button>
              <button @click="dismiss(n.id)" style="font-size:var(--fs-xs);color:var(--muted);background:none;border:none;cursor:pointer;font-family:inherit;padding:0">Kaldir</button>
            </div>
          </div>
        </div>
      </div>
    </template>
    <div x-show="getFiltered().length === 0" style="text-align:center;padding:var(--sp-8);color:var(--muted);font-size:var(--fs-md)">
      Bildirim bulunamadi.
    </div>
  </div>
</div>

<div id="footbar"></div>
<script>
function notificationsPage() {
  return {
    filter: 'Tumu',
    filters: ['Tumu', 'Okunmamis', 'Onemli'],
    notifications: [
      { id:1, title:'SEO Anomalisi Tespit Edildi', badge:'Uyari', badgeColor:'#eab308', badgeBg:'rgba(234,179,8,0.1)', icon:'ph-warning', iconColor:'#eab308', iconBg:'rgba(234,179,8,0.1)', borderColor:'#eab308', desc:'organik trafik son 3 gunde %18 dusus gosteriyor. Icerik guncellemesi veya teknik kontrol onerilir.', time:'5 dakika once', read:false, important:true },
      { id:2, title:'Drupal Adaptor Baglantisi Koptu', badge:'Sistem', badgeColor:'#3b82f6', badgeBg:'rgba(59,130,246,0.1)', icon:'ph-plugs-connected', iconColor:'#3b82f6', iconBg:'rgba(59,130,246,0.1)', borderColor:'#3b82f6', desc:'Drupal JSON:API adaptoru 3 ardisik health check basarisiz oldu. Baglanti durumu Hata olarak guncellendi.', time:'2 saat once', read:false, important:false },
      { id:3, title:'Meta Ads Kampanyasi Basladi', badge:'Basari', badgeColor:'#22c55e', badgeBg:'rgba(34,197,94,0.1)', icon:'ph-megaphone', iconColor:'#22c55e', iconBg:'rgba(34,197,94,0.1)', borderColor:'#22c55e', desc:'Bahar Kampanyasi basariyla aktive edildi. Gunluk butce: 1,200 TL. Hedef kitle: 18-35 yas, Istanbul.', time:'3 saat once', read:true, important:false }
    ],
    getFiltered() {
      return this.notifications.filter(n => {
        if (this.filter === 'Okunmamis') return !n.read;
        if (this.filter === 'Onemli') return n.important;
        return true;
      });
    },
    markAllRead() {
      this.notifications.forEach(n => n.read = true);
      if (window.showToast) showToast('Tum bildirimler okundu olarak isaretlendi');
    },
    dismiss(id) {
      this.notifications = this.notifications.filter(n => n.id !== id);
      if (window.showToast) showToast('Bildirim kaldirildi');
    }
  };
}
</script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('settings'));</script>
</body>
</html>
