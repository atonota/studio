<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sifremi Unuttum — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body class="dark" style="display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:auto">

  <div class="fade-in" x-data="form({email:''})" style="width:100%;max-width:420px;margin:var(--sp-6);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:40px var(--sp-8)">

    <!-- Logo -->
    <div style="display:flex;align-items:center;justify-content:center;gap:var(--sp-3);margin-bottom:var(--sp-2)">
      <div style="width:40px;height:40px;border-radius:var(--r-md);background:var(--accent);display:flex;align-items:center;justify-content:center">
        <span style="font-weight:800;font-size:var(--fs-lg);color:white">a</span>
      </div>
      <span style="font-size:var(--fs-xl);font-weight:600;color:var(--text);letter-spacing:-0.02em">atonota</span>
    </div>
    <h2 style="text-align:center;font-size:var(--fs-xl);font-weight:500;color:var(--text);margin-bottom:var(--sp-2)">Sifremi Unuttum</h2>
    <p style="text-align:center;font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--sp-7)">E-posta adresinize sifre sifirlama linki gonderecegiz.</p>

    <!-- Form -->
    <div style="display:flex;flex-direction:column;gap:var(--sp-4)">
      <div>
        <label style="display:block;font-size:var(--fs-sm);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--sp-2)">E-posta</label>
        <input type="email" placeholder="ornek@sirket.com" style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);color:var(--text);font-family:inherit;outline:none;width:100%;font-size:var(--fs-md)">
      </div>

      <button class="btn-primary" style="width:100%;justify-content:center;margin-top:var(--sp-2);padding:var(--sp-3) 18px;font-size:var(--fs-base)">Sifre Sifirlama Linki Gonder</button>

      <div style="text-align:center;margin-top:var(--sp-2)">
        <a href="auth-login.html" style="font-size:var(--fs-sm);color:var(--accent);text-decoration:none;font-weight:500"><i class="ph ph-arrow-left" style="font-size:var(--fs-sm);margin-right:var(--sp-1)"></i>Giris sayfasina don</a>
      </div>
    </div>
  </div>

</body>
</html>
