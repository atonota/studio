<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Trafik Detay — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>
<div id="main" x-data="{ source: 'tumu', dateRange: '30gun' }">
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px">
    <div>
      <h1 class="page-title">Trafik Detay</h1>
      <p class="page-sub">Kaynak bazli trafik analizi — son 30 gun</p>
    </div>
    <div style="display:flex;gap:4px">
      <template x-for="s in [{v:'tumu',l:'Tumu'},{v:'organik',l:'Organik'},{v:'paid',l:'Paid'},{v:'referral',l:'Referral'},{v:'direct',l:'Direct'}]">
        <button @click="source = s.v" :style="source === s.v ? 'background:var(--accent);color:#fff;border:none' : 'background:var(--surface-2);color:var(--muted);border:1px solid var(--border)'" style="padding:6px 12px;border-radius:6px;font-size:0.75rem;font-weight:500;cursor:pointer;font-family:inherit" x-text="s.l"></button>
      </template>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px">
    <div class="stat-card" style="--stripe:#22c55e">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Organik</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">16.4K</div>
      <div style="font-size:0.75rem;color:#22c55e;margin-top:4px">+12%</div>
    </div>
    <div class="stat-card" style="--stripe:#3b82f6">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Paid</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">7.5K</div>
      <div style="font-size:0.75rem;color:var(--muted);margin-top:4px">₺1.84 CPC</div>
    </div>
    <div class="stat-card" style="--stripe:#a855f7">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Referral</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">6.1K</div>
      <div style="font-size:0.75rem;color:var(--muted);margin-top:4px">42 kaynak</div>
    </div>
    <div class="stat-card" style="--stripe:#eab308">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Direct</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">4.2K</div>
      <div style="font-size:0.75rem;color:var(--muted);margin-top:4px">stabil</div>
    </div>
  </div>

  <!-- Stacked Area Chart -->
  <div class="fade-in-d2 card">
    <span class="section-label">Kaynak Bazli Trafik Trendi</span>
    <div id="chart-traffic" style="width:100%;height:360px"></div>
  </div>
</div>
<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('analytics'));</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const txtColor = '#F2EDE5';
  const mutedColor = '#7B7269';
  const borderColor = '#3C342C';
  const bgColor = '#201C18';

  const days = [];
  for (let i = 1; i <= 30; i++) days.push(i + ' Mar');

  const organic  = [480,520,510,560,540,580,600,590,620,640,610,650,670,660,690,700,680,710,720,740,730,760,750,780,800,790,810,830,820,850];
  const paid     = [220,230,240,250,260,240,230,250,270,260,280,290,270,260,280,300,290,310,300,280,270,290,310,320,300,280,290,310,320,330];
  const referral = [180,190,200,210,190,180,200,210,220,210,200,190,210,220,230,220,200,190,210,220,230,240,220,210,230,240,250,240,220,230];
  const direct   = [120,130,140,130,140,150,140,130,140,150,140,130,140,150,160,150,140,130,140,150,140,130,140,150,160,150,140,130,140,150];

  const c = echarts.init(document.getElementById('chart-traffic'));
  c.setOption({
    tooltip:{trigger:'axis',backgroundColor:bgColor,borderColor:borderColor,textStyle:{color:txtColor,fontSize:12}},
    legend:{data:['Organik','Paid','Referral','Direct'],textStyle:{color:mutedColor,fontSize:11},top:0},
    grid:{left:50,right:20,top:40,bottom:30},
    xAxis:{type:'category',data:days,axisLabel:{color:mutedColor,fontSize:10},axisLine:{lineStyle:{color:borderColor}},boundaryGap:false},
    yAxis:{type:'value',axisLabel:{color:mutedColor,fontSize:10},splitLine:{lineStyle:{color:borderColor,type:'dashed'}},axisLine:{show:false}},
    series:[
      {name:'Organik',type:'line',stack:'total',areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(34,197,94,0.3)'},{offset:1,color:'transparent'}]}},lineStyle:{color:'#22c55e',width:1.5},itemStyle:{color:'#22c55e'},symbol:'none',smooth:true,data:organic},
      {name:'Paid',type:'line',stack:'total',areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(59,130,246,0.3)'},{offset:1,color:'transparent'}]}},lineStyle:{color:'#3b82f6',width:1.5},itemStyle:{color:'#3b82f6'},symbol:'none',smooth:true,data:paid},
      {name:'Referral',type:'line',stack:'total',areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(168,85,247,0.3)'},{offset:1,color:'transparent'}]}},lineStyle:{color:'#a855f7',width:1.5},itemStyle:{color:'#a855f7'},symbol:'none',smooth:true,data:referral},
      {name:'Direct',type:'line',stack:'total',areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(234,179,8,0.3)'},{offset:1,color:'transparent'}]}},lineStyle:{color:'#eab308',width:1.5},itemStyle:{color:'#eab308'},symbol:'none',smooth:true,data:direct}
    ]
  });
  window.addEventListener('resize', () => c.resize());
});
</script>
</body>
</html>
