<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Audit Log — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="table" x-data="{
  searchQuery: '',
  catFilter: 'Tumu',
  categories: ['Tumu','Auth','Tenant','Plugin','Reklam'],
  allRows: [
    { time:'28 Mar 2026, 14:32', initials:'IK', initialsColor:'var(--accent)', initialsBg:'var(--accent-soft)', user:'Ibrahim Karaca', action:'plugin.activate', actionColor:'#22c55e', actionBg:'rgba(34,197,94,0.1)', resource:'WordPress Adaptor v2.1.4', category:'Plugin' },
    { time:'28 Mar 2026, 13:15', initials:'AY', initialsColor:'#3b82f6', initialsBg:'rgba(59,130,246,0.15)', user:'Ayse Yilmaz', action:'campaign.create', actionColor:'#a855f7', actionBg:'rgba(168,85,247,0.1)', resource:'Meta Ads — Bahar Kampanyasi', category:'Reklam' },
    { time:'28 Mar 2026, 11:48', initials:'MO', initialsColor:'#eab308', initialsBg:'rgba(234,179,8,0.15)', user:'Mehmet Ozturk', action:'tenant.update', actionColor:'#3b82f6', actionBg:'rgba(59,130,246,0.1)', resource:'Delta A.S. — Plan degisikligi', category:'Tenant' },
    { time:'28 Mar 2026, 09:22', initials:'IK', initialsColor:'var(--accent)', initialsBg:'var(--accent-soft)', user:'Ibrahim Karaca', action:'auth.login', actionColor:'#eab308', actionBg:'rgba(234,179,8,0.1)', resource:'IP: 85.107.xx.xx — Istanbul', category:'Auth' }
  ],
  get filtered() {
    return this.allRows.filter(r => {
      const matchCat = this.catFilter === 'Tumu' || r.category === this.catFilter;
      const matchSearch = !this.searchQuery || r.user.toLowerCase().includes(this.searchQuery.toLowerCase()) || r.action.toLowerCase().includes(this.searchQuery.toLowerCase()) || r.resource.toLowerCase().includes(this.searchQuery.toLowerCase());
      return matchCat && matchSearch;
    });
  }
}">
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">Audit Log</h1>
    <p class="page-sub">Sistem olay gecmisi</p>
  </div>

  <!-- Search -->
  <div class="fade-in-d1" style="margin-bottom:var(--sp-4)">
    <div style="position:relative;max-width:400px">
      <i class="ph ph-magnifying-glass" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:var(--fs-lg);color:var(--muted)"></i>
      <input type="text" placeholder="Kullanici, islem veya kaynak ara..." x-model="searchQuery" style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4) var(--sp-3) 42px;color:var(--text);width:100%;font-family:inherit;font-size:var(--fs-md);outline:none" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'">
    </div>
  </div>

  <!-- Category Filters -->
  <div class="fade-in-d1" style="display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-5)">
    <template x-for="cat in categories" :key="cat">
      <span class="badge" @click="catFilter = cat"
        :style="catFilter === cat
          ? 'background:var(--accent-soft);color:var(--accent);cursor:pointer;padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm)'
          : 'background:var(--surface-2);color:var(--text-soft);cursor:pointer;padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);border:1px solid var(--border)'"
        x-text="cat"></span>
    </template>
  </div>

  <!-- Audit Table -->
  <div class="fade-in-d2 card" data-paginate="10" style="padding:0;overflow:hidden">
    <div style="padding:var(--sp-3) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:end">
      <button onclick="if(window.exportToCSV)exportToCSV(['Zaman','Kullanici','Islem','Kaynak'], document.querySelectorAll('#main table tbody tr'))" class="btn-secondary" style="font-size:var(--fs-sm);gap:var(--sp-1);padding:var(--sp-2) var(--sp-3);"><i class="ph ph-download-simple"></i>CSV</button>
    </div>
    <table class="r-table">
      <thead>
        <tr>
          <th>Zaman</th>
          <th>Kullanici</th>
          <th>Islem</th>
          <th>Kaynak</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in filtered" :key="row.time + row.action">
          <tr>
            <td data-label="Zaman"><span style="font-size:var(--fs-sm);color:var(--muted)" x-text="row.time"></span></td>
            <td data-label="Kullanici">
              <div style="display:flex;align-items:center;gap:var(--sp-2)">
                <div :style="'width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:700;background:'+row.initialsBg+';color:'+row.initialsColor" x-text="row.initials"></div>
                <span style="color:var(--text)" x-text="row.user"></span>
              </div>
            </td>
            <td data-label="Islem"><span class="badge" :style="'background:'+row.actionBg+';color:'+row.actionColor" x-text="row.action"></span></td>
            <td data-label="Kaynak"><span style="color:var(--text)" x-text="row.resource"></span></td>
            <td><a href="audit-detail.html" style="color:var(--accent);font-size:var(--fs-sm);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:var(--sp-1);">Detay <i class="ph ph-arrow-right" style="font-size:var(--fs-sm)"></i></a></td>
          </tr>
        </template>
      </tbody>
    </table>
    <div x-show="filtered.length === 0" style="padding:var(--sp-6);text-align:center;color:var(--muted);font-size:var(--fs-md)">
      Secili filtrelere uygun kayit bulunamadi.
    </div>
  </div>
</div>

<div id="footbar"></div>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
<script src="../js/mock-data.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('settings'));</script>
</body>
</html>
