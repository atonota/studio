<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Reklamlar — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main" x-data="{ platform: 'tumu', dateRange: '7gun' }">
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px">
    <div>
      <h1 class="page-title">Reklamlar</h1>
      <p class="page-sub">Cross-channel reklam orkestrasyon</p>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="display:flex;gap:4px">
        <template x-for="d in [{v:'7gun',l:'7 Gun'},{v:'30gun',l:'30 Gun'},{v:'90gun',l:'90 Gun'}]">
          <button @click="dateRange = d.v" :style="dateRange === d.v ? 'background:var(--accent);color:#fff;border:none' : 'background:var(--surface-2);color:var(--muted);border:1px solid var(--border)'" style="padding:6px 12px;border-radius:6px;font-size:0.75rem;font-weight:500;cursor:pointer;font-family:inherit" x-text="d.l"></button>
        </template>
      </div>
      <button class="btn-primary"><i class="ph ph-plus"></i> Yeni Kampanya</button>
    </div>
  </div>

  <!-- Platform Filter Pills -->
  <div class="fade-in" style="display:flex;gap:6px;margin-bottom:16px">
    <template x-for="p in [{v:'tumu',l:'Tumu'},{v:'meta',l:'Meta'},{v:'tiktok',l:'TikTok'},{v:'linkedin',l:'LinkedIn'}]">
      <button @click="platform = p.v" :style="platform === p.v ? 'background:var(--accent);color:#fff;border:none' : 'background:var(--surface-2);color:var(--muted);border:1px solid var(--border)'" style="padding:6px 14px;border-radius:6px;font-size:0.8125rem;font-weight:500;cursor:pointer;font-family:inherit" x-text="p.l"></button>
    </template>
  </div>

  <!-- Platform Cards -->
  <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">
    <!-- Meta -->
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <div style="width:36px;height:36px;border-radius:8px;background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center">
          <i class="ph ph-meta-logo" style="color:#3b82f6;font-size:1.125rem"></i>
        </div>
        <div>
          <div style="font-weight:500;color:var(--text)">Meta Ads</div>
          <div style="font-size:0.6875rem;color:var(--muted)">Facebook + Instagram</div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e;margin-left:auto">Aktif</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:0.75rem;color:var(--muted)">Harcama</span>
        <span style="font-size:0.875rem;font-weight:500;color:var(--text)">&#8378;22,340</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:0.75rem;color:var(--muted)">ROAS</span>
        <span style="font-size:0.875rem;font-weight:500;color:#22c55e">3.2x</span>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span style="font-size:0.75rem;color:var(--muted)">Kampanya</span>
        <span style="font-size:0.875rem;font-weight:500;color:var(--text)">3 aktif</span>
      </div>
    </div>
    <!-- TikTok -->
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <div style="width:36px;height:36px;border-radius:8px;background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center">
          <i class="ph ph-tiktok-logo" style="color:#a855f7;font-size:1.125rem"></i>
        </div>
        <div>
          <div style="font-weight:500;color:var(--text)">TikTok Ads</div>
          <div style="font-size:0.6875rem;color:var(--muted)">In-Feed + TopView</div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e;margin-left:auto">Aktif</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:0.75rem;color:var(--muted)">Harcama</span>
        <span style="font-size:0.875rem;font-weight:500;color:var(--text)">&#8378;18,480</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:0.75rem;color:var(--muted)">ROAS</span>
        <span style="font-size:0.875rem;font-weight:500;color:#22c55e">2.8x</span>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span style="font-size:0.75rem;color:var(--muted)">Kampanya</span>
        <span style="font-size:0.875rem;font-weight:500;color:var(--text)">2 aktif</span>
      </div>
    </div>
    <!-- LinkedIn -->
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <div style="width:36px;height:36px;border-radius:8px;background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center">
          <i class="ph ph-linkedin-logo" style="color:#3b82f6;font-size:1.125rem"></i>
        </div>
        <div>
          <div style="font-weight:500;color:var(--text)">LinkedIn Ads</div>
          <div style="font-size:0.6875rem;color:var(--muted)">Sponsored Content</div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e;margin-left:auto">Aktif</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:0.75rem;color:var(--muted)">Harcama</span>
        <span style="font-size:0.875rem;font-weight:500;color:var(--text)">&#8378;7,900</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <span style="font-size:0.75rem;color:var(--muted)">ROAS</span>
        <span style="font-size:0.875rem;font-weight:500;color:#eab308">1.9x</span>
      </div>
      <div style="display:flex;justify-content:space-between">
        <span style="font-size:0.75rem;color:var(--muted)">Kampanya</span>
        <span style="font-size:0.875rem;font-weight:500;color:var(--text)">1 aktif</span>
      </div>
    </div>
  </div>

  <!-- Treemap -->
  <div class="fade-in-d2 card">
    <span class="section-label">Butce Dagilimi</span>
    <div id="chart-treemap" style="width:100%;height:320px"></div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('ads'));</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const txtColor = '#F2EDE5';
  const borderColor = '#3C342C';

  const cTree = echarts.init(document.getElementById('chart-treemap'));
  cTree.setOption({
    tooltip:{backgroundColor:'#201C18',borderColor:borderColor,textStyle:{color:txtColor,fontSize:12},formatter:function(p){return p.name+': ₺'+p.value.toLocaleString('tr-TR')}},
    series:[{
      type:'treemap',
      roam:false,
      breadcrumb:{show:false},
      levels:[{itemStyle:{borderColor:borderColor,borderWidth:2,gapWidth:2}},{itemStyle:{borderColor:borderColor,borderWidth:1,gapWidth:1},colorSaturation:[0.4,0.7]}],
      label:{show:true,color:txtColor,fontSize:11,formatter:'{b}\n₺{c}'},
      data:[
        {name:'Meta Ads',itemStyle:{color:'#3b82f6'},children:[
          {name:'Bahar Kampanyasi',value:9800},{name:'Retargeting',value:7200},{name:'Brand Awareness',value:5340}
        ]},
        {name:'TikTok Ads',itemStyle:{color:'#a855f7'},children:[
          {name:'Gen-Z Kampanya',value:11200},{name:'Urun Tanitim',value:7280}
        ]},
        {name:'LinkedIn Ads',itemStyle:{color:'#22c55e'},children:[
          {name:'B2B Lead Gen',value:5400},{name:'Webinar Promo',value:2500}
        ]}
      ]
    }]
  });

  window.addEventListener('resize', () => cTree.resize());
});
</script>
</body>
</html>
