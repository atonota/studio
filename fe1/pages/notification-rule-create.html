<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Yeni Bildirim Kurali — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="form" x-data="{
  ...form({kural_adi:'', metrik:'organic_traffic', operator:'buyuktur (>)', esik:'20', pencere:'24 saat', cooldown:'30 dakika'}),
  channels: ['inapp','email']
}">
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">Yeni Bildirim Kurali</h1>
    <p class="page-sub">Kosul tabanli otomatik bildirim olustur</p>
  </div>

  <div style="max-width:640px">
    <!-- Kural Adi -->
    <div class="fade-in-d1 card" style="margin-bottom:var(--sp-6)">
      <label style="font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:var(--sp-2)">Kural Adi</label>
      <input type="text" x-model="fields.kural_adi" placeholder="orn: Trafik Dususu Alarmi" style="width:100%;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:var(--fs-md);outline:none;box-sizing:border-box"
             :style="hasError('kural_adi') ? 'border-color:#ef4444' : ''" />
      <span x-show="hasError('kural_adi')" style="font-size:var(--fs-sm);color:#ef4444;margin-top:var(--sp-1);display:block" x-text="getError('kural_adi')"></span>
    </div>

    <!-- EGER (Kosullar) -->
    <div class="fade-in-d2 card" style="margin-bottom:var(--sp-6)">
      <div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-4)">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--r-sm);background:rgba(59,130,246,0.1);color:#3b82f6;font-size:var(--fs-xs);font-weight:700">IF</span>
        <span class="section-label" style="margin-bottom:0">Kosullar</span>
      </div>
      <!-- Condition Row -->
      <div style="display:grid;grid-template-columns:1fr 1fr 100px 1fr;gap:var(--sp-3);margin-bottom:var(--sp-3)">
        <div>
          <label style="font-size:var(--fs-xs);color:var(--muted);display:block;margin-bottom:var(--sp-1)">Metrik</label>
          <select x-model="fields.metrik" style="width:100%;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:var(--fs-sm);outline:none;box-sizing:border-box">
            <option>organic_traffic</option>
            <option>keyword_rank</option>
            <option>page_speed</option>
            <option>uptime_check</option>
          </select>
        </div>
        <div>
          <label style="font-size:var(--fs-xs);color:var(--muted);display:block;margin-bottom:var(--sp-1)">Operator</label>
          <select x-model="fields.operator" style="width:100%;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:var(--fs-sm);outline:none;box-sizing:border-box">
            <option>buyuktur (>)</option>
            <option>kucuktur (<)</option>
            <option>degisim %</option>
          </select>
        </div>
        <div>
          <label style="font-size:var(--fs-xs);color:var(--muted);display:block;margin-bottom:var(--sp-1)">Esik</label>
          <input type="number" x-model="fields.esik" style="width:100%;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:var(--fs-sm);outline:none;box-sizing:border-box"
                 :style="hasError('esik') ? 'border-color:#ef4444' : ''" />
          <span x-show="hasError('esik')" style="font-size:0.7rem;color:#ef4444" x-text="getError('esik')"></span>
        </div>
        <div>
          <label style="font-size:var(--fs-xs);color:var(--muted);display:block;margin-bottom:var(--sp-1)">Pencere</label>
          <select x-model="fields.pencere" style="width:100%;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:var(--fs-sm);outline:none;box-sizing:border-box">
            <option>1 saat</option>
            <option>6 saat</option>
            <option>24 saat</option>
            <option>7 gun</option>
          </select>
        </div>
      </div>
      <button style="padding:0;border:none;background:none;color:var(--accent);font-size:var(--fs-sm);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:var(--sp-1)" @click="$store.toast.show('Coklu kosul destegi yakinda!','info')">
        <i class="ph ph-plus"></i> Kosul Ekle
      </button>
    </div>

    <!-- O ZAMAN (Aksiyonlar) -->
    <div class="fade-in-d3 card" style="margin-bottom:var(--sp-6)">
      <div style="display:flex;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-4)">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:36px;height:28px;border-radius:var(--r-sm);background:rgba(34,197,94,0.1);color:#22c55e;font-size:var(--fs-xs);font-weight:700">THEN</span>
        <span class="section-label" style="margin-bottom:0">Aksiyonlar</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--sp-3)">
        <!-- In-App -->
        <label @click="channels.includes('inapp') ? channels.splice(channels.indexOf('inapp'),1) : channels.push('inapp')" style="display:flex;align-items:center;gap:var(--sp-3);cursor:pointer">
          <div style="width:20px;height:20px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:all 0.15s"
               :style="channels.includes('inapp') ? 'border:2px solid var(--accent);background:var(--accent)' : 'border:2px solid var(--border);background:transparent'">
            <i x-show="channels.includes('inapp')" class="ph ph-check" style="color:white;font-size:var(--fs-sm)"></i>
          </div>
          <span style="font-size:var(--fs-md);color:var(--text)">In-App Bildirim</span>
        </label>
        <!-- E-posta -->
        <label @click="channels.includes('email') ? channels.splice(channels.indexOf('email'),1) : channels.push('email')" style="display:flex;align-items:center;gap:var(--sp-3);cursor:pointer">
          <div style="width:20px;height:20px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:all 0.15s"
               :style="channels.includes('email') ? 'border:2px solid var(--accent);background:var(--accent)' : 'border:2px solid var(--border);background:transparent'">
            <i x-show="channels.includes('email')" class="ph ph-check" style="color:white;font-size:var(--fs-sm)"></i>
          </div>
          <span style="font-size:var(--fs-md);color:var(--text)">E-posta</span>
        </label>
        <!-- Webhook -->
        <label @click="channels.includes('webhook') ? channels.splice(channels.indexOf('webhook'),1) : channels.push('webhook')" style="display:flex;align-items:center;gap:var(--sp-3);cursor:pointer">
          <div style="width:20px;height:20px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;transition:all 0.15s"
               :style="channels.includes('webhook') ? 'border:2px solid var(--accent);background:var(--accent)' : 'border:2px solid var(--border);background:transparent'">
            <i x-show="channels.includes('webhook')" class="ph ph-check" style="color:white;font-size:var(--fs-sm)"></i>
          </div>
          <span style="font-size:var(--fs-md);color:var(--text)">Webhook</span>
        </label>
      </div>
    </div>

    <!-- Bekleme Suresi -->
    <div class="fade-in-d4 card" style="margin-bottom:var(--sp-6)">
      <label style="font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;display:block;margin-bottom:var(--sp-2)">Bekleme Suresi (Cooldown)</label>
      <select x-model="fields.cooldown" style="width:100%;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:var(--fs-md);outline:none;box-sizing:border-box">
        <option>15 dakika</option>
        <option>30 dakika</option>
        <option>60 dakika</option>
        <option>6 saat</option>
      </select>
      <div style="font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-2)">Ayni kural tetiklendikten sonra tekrar tetiklenmeden onceki minimum bekleme suresi.</div>
    </div>

    <!-- Actions -->
    <div class="fade-in-d5" style="display:flex;justify-content:flex-end;gap:var(--sp-3)">
      <button @click="reset()" style="padding:var(--sp-3) var(--sp-6);border-radius:var(--r-md);border:1px solid var(--border);background:transparent;color:var(--text);font-size:var(--fs-sm);font-weight:500;cursor:pointer">Iptal</button>
      <button class="btn-primary" :disabled="submitting" @click="
        errors = {};
        if(!fields.kural_adi.trim()) errors.kural_adi = 'Kural adi zorunlu';
        if(!fields.esik || Number(fields.esik) <= 0) errors.esik = 'Esik degeri zorunlu';
        if(channels.length === 0) { $store.toast.show('En az bir kanal secmelisiniz','warning'); return; }
        if(Object.keys(errors).length === 0) { submitting=true; setTimeout(()=>{ submitting=false; submitted=true; $store.toast.show('Bildirim kurali kaydedildi!','success') }, 1200) }
      ">
        <template x-if="submitting"><span style="display:flex;align-items:center;gap:var(--sp-2)"><i class="ph ph-spinner ph-spin"></i> Kaydediliyor...</span></template>
        <template x-if="!submitting">Kaydet</template>
      </button>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/components.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('settings'));</script>
</body>
</html>
