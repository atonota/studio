<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Icerik Gap Analizi — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/tokens.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main" x-data="{
  priorityFilter: 'tumu',
  sortBy: 'none',
  gaps: [
    {topic:'e-ticaret seo rehberi',priority:'Yuksek',priorityColor:'#ef4444',rakip:3,trafik:4200},
    {topic:'instagram reklam maliyeti',priority:'Yuksek',priorityColor:'#ef4444',rakip:2,trafik:8100},
    {topic:'google ads butce hesaplama',priority:'Orta',priorityColor:'#eab308',rakip:4,trafik:3600},
    {topic:'wordpress hiz optimizasyonu',priority:'Yuksek',priorityColor:'#ef4444',rakip:2,trafik:5400},
    {topic:'dijital pazarlama trendleri 2026',priority:'Dusuk',priorityColor:'#3b82f6',rakip:1,trafik:2800}
  ],
  get filtered() {
    let r = this.gaps;
    if (this.priorityFilter !== 'tumu') r = r.filter(g => g.priority === this.priorityFilter);
    if (this.sortBy === 'trafik') r = [...r].sort((a,b) => b.trafik - a.trafik);
    return r;
  }
}">
  <div class="fade-in" style="margin-bottom:24px">
    <h1 class="page-title">Icerik Gap Analizi</h1>
    <p class="page-sub">Rakiplerin kapladigi, sizin eksik oldugunuz konular</p>
  </div>

  <!-- Stat Cards -->
  <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">
    <div class="stat-card" style="--stripe:#a855f7">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Tespit Edilen Gap</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">24</div>
    </div>
    <div class="stat-card" style="--stripe:#22c55e">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Firsat Skoru</span>
      <div style="font-size:1.75rem;font-weight:300;color:#22c55e;margin-top:8px">Yuksek</div>
    </div>
    <div class="stat-card" style="--stripe:#3b82f6">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Rakip Kapsam</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">87%</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="fade-in-d2" style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
    <div style="display:flex;gap:4px">
      <template x-for="f in ['tumu','Yuksek','Orta','Dusuk']">
        <button @click="priorityFilter = f" :style="priorityFilter === f ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : 'background:var(--surface-2);color:var(--muted)'" style="padding:6px 14px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:all .15s" x-text="f === 'tumu' ? 'Tumu' : f"></button>
      </template>
    </div>
    <button @click="sortBy = sortBy === 'trafik' ? 'none' : 'trafik'" :style="sortBy === 'trafik' ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : 'background:var(--surface-2);color:var(--muted)'" style="padding:6px 14px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:all .15s"><i class="ph ph-sort-descending" style="margin-right:4px"></i> Trafige Gore</button>
  </div>

  <!-- Gap List -->
  <div class="fade-in-d2 card" style="padding:0;overflow:hidden">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
      <span class="section-label" style="margin-bottom:0">Icerik Firsatlari</span>
    </div>
    <template x-for="(gap, idx) in filtered" :key="gap.topic">
      <div :style="'padding:16px 20px;' + (idx < filtered.length - 1 ? 'border-bottom:1px solid var(--border)' : '')">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px">
          <span style="font-weight:500;color:var(--text);font-size:0.9375rem" x-text="gap.topic"></span>
          <span class="badge" :style="'background:rgba('+(gap.priority==='Yuksek'?'239,68,68':gap.priority==='Orta'?'234,179,8':'59,130,246')+',0.1);color:'+gap.priorityColor" x-text="gap.priority"></span>
        </div>
        <div style="display:flex;gap:24px;font-size:0.8125rem;color:var(--muted)">
          <div style="display:flex;align-items:center;gap:4px"><i class="ph ph-users" style="font-size:0.875rem"></i> <span x-text="gap.rakip + ' rakip'"></span></div>
          <div style="display:flex;align-items:center;gap:4px"><i class="ph ph-chart-line-up" style="font-size:0.875rem"></i> <span x-text="gap.trafik.toLocaleString('tr-TR') + ' tahmini trafik'"></span></div>
          <a href="content-writing-assistant.html" style="color:var(--accent);font-size:0.8125rem;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px;">
            Icerik Olustur <i class="ph ph-arrow-right" style="font-size:0.75rem"></i>
          </a>
        </div>
      </div>
    </template>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('content'));</script>
</body>
</html>
