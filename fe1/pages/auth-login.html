<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Giris Yap — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
</head>
<body class="dark" style="display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:auto">

  <div class="fade-in" style="width:100%;max-width:420px;margin:24px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:40px 32px"
       x-data="form({email:'', password:''})">

    <!-- Logo -->
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px">
      <div style="width:40px;height:40px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center">
        <span style="font-weight:800;font-size:1.125rem;color:white">a</span>
      </div>
      <span style="font-size:1.25rem;font-weight:600;color:var(--text);letter-spacing:-0.02em">atonota</span>
      <span class="badge" style="background:var(--accent-soft);color:var(--accent)">Studio</span>
    </div>

    <!-- Form -->
    <form @submit.prevent="
      errors = {};
      if(!fields.email || !fields.email.includes('@')) errors.email = 'Gecerli bir e-posta girin';
      if(!fields.password) errors.password = 'Sifre zorunlu';
      if(Object.keys(errors).length === 0) { submitting=true; setTimeout(()=>{ submitting=false; submitted=true; window.location.href='index.html' }, 1500) }
    " style="display:flex;flex-direction:column;gap:16px">
      <div>
        <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">E-posta</label>
        <input type="email" x-model="fields.email" placeholder="ornek@sirket.com" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:inherit;outline:none;width:100%;font-size:0.875rem;box-sizing:border-box"
               :style="hasError('email') ? 'border-color:#ef4444' : ''">
        <span x-show="hasError('email')" style="font-size:0.75rem;color:#ef4444;margin-top:4px;display:block" x-text="getError('email')"></span>
      </div>
      <div>
        <label style="display:block;font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px">Sifre</label>
        <input type="password" x-model="fields.password" placeholder="••••••••" style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:inherit;outline:none;width:100%;font-size:0.875rem;box-sizing:border-box"
               :style="hasError('password') ? 'border-color:#ef4444' : ''">
        <span x-show="hasError('password')" style="font-size:0.75rem;color:#ef4444;margin-top:4px;display:block" x-text="getError('password')"></span>
      </div>

      <button type="submit" class="btn-primary" :disabled="submitting" style="width:100%;justify-content:center;margin-top:8px;padding:12px 18px;font-size:0.9375rem">
        <template x-if="submitting"><span style="display:flex;align-items:center;justify-content:center;gap:8px"><i class="ph ph-spinner ph-spin"></i> Giris yapiliyor...</span></template>
        <template x-if="!submitting">Giris Yap</template>
      </button>

      <div style="text-align:center;margin-top:4px">
        <a href="auth-forgot.html" style="font-size:0.8125rem;color:var(--accent);text-decoration:none;font-weight:500">Sifremi Unuttum</a>
      </div>

      <div style="text-align:center;margin-top:8px;padding-top:16px;border-top:1px solid var(--border)">
        <span style="font-size:0.8125rem;color:var(--muted)">Hesabiniz yok mu?</span>
        <a href="auth-register.html" style="font-size:0.8125rem;color:var(--accent);text-decoration:none;font-weight:600;margin-left:4px">Kayit Ol</a>
      </div>
    </form>
  </div>

<script src="../js/components.js"></script>
</body>
</html>
