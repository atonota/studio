<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Giris Yap — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
</head>
<body class="dark" style="display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:auto">

  <div class="fade-in" style="width:100%;max-width:420px;margin:var(--sp-6);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:40px var(--sp-8)"
       x-data="form({email:'', password:''})">

    <!-- Logo -->
    <div style="display:flex;align-items:center;justify-content:center;gap:var(--sp-3);margin-bottom:var(--sp-8)">
      <div style="width:40px;height:40px;border-radius:var(--r-md);background:var(--accent);display:flex;align-items:center;justify-content:center">
        <span style="font-weight:800;font-size:var(--fs-lg);color:white">a</span>
      </div>
      <span style="font-size:var(--fs-xl);font-weight:600;color:var(--text);letter-spacing:-0.02em">atonota</span>
      <span class="badge" style="background:var(--accent-soft);color:var(--accent)">Studio</span>
    </div>

    <!-- Form -->
    <form @submit.prevent="
      errors = {};
      if(!fields.email || !fields.email.includes('@')) errors.email = 'Gecerli bir e-posta girin';
      if(!fields.password) errors.password = 'Sifre zorunlu';
      if(Object.keys(errors).length === 0) { submitting=true; setTimeout(()=>{ submitting=false; submitted=true; window.location.href='index.html' }, 1500) }
    " style="display:flex;flex-direction:column;gap:var(--sp-4)">
      <div>
        <label style="display:block;font-size:var(--fs-sm);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--sp-2)">E-posta</label>
        <input type="email" x-model="fields.email" placeholder="ornek@sirket.com" style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);color:var(--text);font-family:inherit;outline:none;width:100%;font-size:var(--fs-md);box-sizing:border-box"
               :style="hasError('email') ? 'border-color:#ef4444' : ''">
        <span x-show="hasError('email')" style="font-size:var(--fs-sm);color:#ef4444;margin-top:var(--sp-1);display:block" x-text="getError('email')"></span>
      </div>
      <div>
        <label style="display:block;font-size:var(--fs-sm);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--sp-2)">Sifre</label>
        <input type="password" x-model="fields.password" placeholder="••••••••" style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--sp-3) var(--sp-4);color:var(--text);font-family:inherit;outline:none;width:100%;font-size:var(--fs-md);box-sizing:border-box"
               :style="hasError('password') ? 'border-color:#ef4444' : ''">
        <span x-show="hasError('password')" style="font-size:var(--fs-sm);color:#ef4444;margin-top:var(--sp-1);display:block" x-text="getError('password')"></span>
      </div>

      <button type="submit" class="btn-primary" :disabled="submitting" style="width:100%;justify-content:center;margin-top:var(--sp-2);padding:var(--sp-3) 18px;font-size:var(--fs-base)">
        <template x-if="submitting"><span style="display:flex;align-items:center;justify-content:center;gap:var(--sp-2)"><i class="ph ph-spinner ph-spin"></i> Giris yapiliyor...</span></template>
        <template x-if="!submitting">Giris Yap</template>
      </button>

      <div style="text-align:center;margin-top:var(--sp-1)">
        <a href="auth-forgot.html" style="font-size:var(--fs-sm);color:var(--accent);text-decoration:none;font-weight:500">Sifremi Unuttum</a>
      </div>

      <div style="text-align:center;margin-top:var(--sp-2);padding-top:var(--sp-4);border-top:1px solid var(--border)">
        <span style="font-size:var(--fs-sm);color:var(--muted)">Hesabiniz yok mu?</span>
        <a href="auth-register.html" style="font-size:var(--fs-sm);color:var(--accent);text-decoration:none;font-weight:600;margin-left:var(--sp-1)">Kayit Ol</a>
      </div>
    </form>
  </div>

<script src="../js/components.js"></script>
</body>
</html>
