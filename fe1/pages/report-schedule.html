<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Rapor Zamanlama — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="table" x-data="{
  schedules: [
    { id:1, name:'Haftalik SEO Ozeti', freq:'Haftalik', freqColor:'#3b82f6', next:'31 Mar 2026, 09:00', recipients:['ibrahim@atonota.com','ekip@atonota.com'], active:true, editing:false },
    { id:2, name:'Aylik Performans Raporu', freq:'Aylik', freqColor:'#a855f7', next:'1 Nis 2026, 08:00', recipients:['ibrahim@atonota.com','yonetim@atonota.com'], active:true, editing:false },
    { id:3, name:'Gunluk Uptime Bildirimi', freq:'Gunluk', freqColor:'#22c55e', next:'29 Mar 2026, 07:00', recipients:['devops@atonota.com'], active:false, editing:false }
  ],
  toggleActive(id) {
    const s = this.schedules.find(x=>x.id===id);
    if(s) { s.active=!s.active; $store.toast.show(s.active?'Zamanlama aktif':'Zamanlama pasif', s.active?'success':'info'); }
  },
  toggleEdit(id) {
    const s = this.schedules.find(x=>x.id===id);
    if(s) { s.editing=!s.editing; if(!s.editing) $store.toast.show('Kaydedildi','success'); }
  }
}">
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">Rapor Zamanlama</h1>
    <p class="page-sub">Otomatik rapor gonderim zamanlari</p>
  </div>

  <div class="fade-in-d1 card" data-paginate="10" style="padding:0;overflow:hidden">
    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-2)">
      <span class="section-label" style="margin-bottom:0">Zamanlanmis Raporlar</span>
      <div style="display:flex;gap:var(--sp-2);align-items:center">
      <button onclick="if(window.exportToCSV)exportToCSV(['Rapor Adi','Siklik','Sonraki Calisma','Alicilar','Durum'], document.querySelectorAll('#main table tbody tr'))" class="btn-secondary" style="font-size:var(--fs-sm);gap:var(--sp-1);padding:var(--sp-2) var(--sp-3);"><i class="ph ph-download-simple"></i>CSV</button>
      <button @click="$store.toast.show('Yeni zamanlama formu acildi','info')" style="background:var(--accent);color:#fff;border:none;padding:var(--sp-2) var(--sp-4);border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:var(--sp-2)">
        <i class="ph ph-plus" style="font-size:var(--fs-md)"></i>
        Yeni Zamanlama
      </button>
      </div>
    </div>

    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:var(--fs-sm)">
        <thead>
          <tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;padding:var(--sp-3) var(--sp-5);color:var(--muted);font-weight:600;font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:0.05em">Rapor Adi</th>
            <th style="text-align:left;padding:var(--sp-3) var(--sp-4);color:var(--muted);font-weight:600;font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:0.05em">Siklik</th>
            <th style="text-align:left;padding:var(--sp-3) var(--sp-4);color:var(--muted);font-weight:600;font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:0.05em">Sonraki Calisma</th>
            <th style="text-align:left;padding:var(--sp-3) var(--sp-4);color:var(--muted);font-weight:600;font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:0.05em">Alicilar</th>
            <th style="text-align:center;padding:var(--sp-3) var(--sp-4);color:var(--muted);font-weight:600;font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:0.05em">Durum</th>
            <th style="text-align:center;padding:var(--sp-3) var(--sp-5);color:var(--muted);font-weight:600;font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:0.05em">Islem</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="s in schedules" :key="s.id">
            <tr style="border-bottom:1px solid var(--border)">
              <td data-label="Rapor Adi" style="padding:var(--sp-4) var(--sp-5);font-weight:500">
                <span x-show="!s.editing" style="color:var(--text)" x-text="s.name"></span>
                <input x-show="s.editing" x-model="s.name" style="padding:var(--sp-1) var(--sp-2);border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-sm);width:100%">
              </td>
              <td data-label="Siklik" style="padding:var(--sp-4) var(--sp-4)">
                <span :style="'font-size:var(--fs-xs);padding:2px var(--sp-3);border-radius:var(--r-full);background:'+s.freqColor+'18;color:'+s.freqColor+';font-weight:600'" x-text="s.freq"></span>
              </td>
              <td data-label="Sonraki Calisma" style="padding:var(--sp-4) var(--sp-4);color:var(--muted)" x-text="s.next"></td>
              <td data-label="Alicilar" style="padding:var(--sp-4) var(--sp-4)">
                <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">
                  <template x-for="r in s.recipients">
                    <span style="font-size:var(--fs-xs);padding:2px var(--sp-2);border-radius:var(--r-full);background:var(--surface-2);color:var(--text)" x-text="r"></span>
                  </template>
                </div>
              </td>
              <td data-label="Durum" style="padding:var(--sp-4) var(--sp-4);text-align:center">
                <div @click="toggleActive(s.id)" :style="s.active ? 'background:#22c55e' : 'background:var(--border)'" style="width:36px;height:20px;border-radius:var(--r-md);position:relative;cursor:pointer;margin:0 auto;transition:background .2s">
                  <div :style="s.active ? 'transform:translateX(16px)' : 'transform:translateX(2px)'" style="width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .2s"></div>
                </div>
              </td>
              <td data-label="Islem" style="padding:var(--sp-4) var(--sp-5);text-align:center">
                <button @click="toggleEdit(s.id)" :style="s.editing ? 'color:#22c55e' : 'color:var(--muted)'" style="background:none;border:none;cursor:pointer;font-size:var(--fs-lg)">
                  <i class="ph" :class="s.editing ? 'ph-check' : 'ph-pencil-simple'"></i>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/mock-data.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('ai'));</script>
</body>
</html>
