<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Rapor Zamanlama — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main" x-data="{
  schedules: [
    { id:1, name:'Haftalik SEO Ozeti', freq:'Haftalik', freqColor:'#3b82f6', next:'31 Mar 2026, 09:00', recipients:['ibrahim@atonota.com','ekip@atonota.com'], active:true, editing:false },
    { id:2, name:'Aylik Performans Raporu', freq:'Aylik', freqColor:'#a855f7', next:'1 Nis 2026, 08:00', recipients:['ibrahim@atonota.com','yonetim@atonota.com'], active:true, editing:false },
    { id:3, name:'Gunluk Uptime Bildirimi', freq:'Gunluk', freqColor:'#22c55e', next:'29 Mar 2026, 07:00', recipients:['devops@atonota.com'], active:false, editing:false }
  ],
  toggleActive(id) {
    const s = this.schedules.find(x=>x.id===id);
    if(s) { s.active=!s.active; $store.toast.show(s.active?'Zamanlama aktif':'Zamanlama pasif', s.active?'success':'info'); }
  },
  toggleEdit(id) {
    const s = this.schedules.find(x=>x.id===id);
    if(s) { s.editing=!s.editing; if(!s.editing) $store.toast.show('Kaydedildi','success'); }
  }
}">
  <div class="fade-in" style="margin-bottom:24px">
    <h1 class="page-title">Rapor Zamanlama</h1>
    <p class="page-sub">Otomatik rapor gonderim zamanlari</p>
  </div>

  <div class="fade-in-d1 card" style="padding:0;overflow:hidden">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span class="section-label" style="margin-bottom:0">Zamanlanmis Raporlar</span>
      <button @click="$store.toast.show('Yeni zamanlama formu acildi','info')" style="background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:0.75rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px">
        <i class="ph ph-plus" style="font-size:0.875rem"></i>
        Yeni Zamanlama
      </button>
    </div>

    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:0.8125rem">
        <thead>
          <tr style="border-bottom:1px solid var(--border)">
            <th style="text-align:left;padding:12px 20px;color:var(--muted);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">Rapor Adi</th>
            <th style="text-align:left;padding:12px 16px;color:var(--muted);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">Siklik</th>
            <th style="text-align:left;padding:12px 16px;color:var(--muted);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">Sonraki Calisma</th>
            <th style="text-align:left;padding:12px 16px;color:var(--muted);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">Alicilar</th>
            <th style="text-align:center;padding:12px 16px;color:var(--muted);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">Durum</th>
            <th style="text-align:center;padding:12px 20px;color:var(--muted);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em">Islem</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="s in schedules" :key="s.id">
            <tr style="border-bottom:1px solid var(--border)">
              <td style="padding:14px 20px;font-weight:500">
                <span x-show="!s.editing" style="color:var(--text)" x-text="s.name"></span>
                <input x-show="s.editing" x-model="s.name" style="padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:0.8125rem;width:100%">
              </td>
              <td style="padding:14px 16px">
                <span :style="'font-size:0.6875rem;padding:2px 10px;border-radius:9999px;background:'+s.freqColor+'18;color:'+s.freqColor+';font-weight:600'" x-text="s.freq"></span>
              </td>
              <td style="padding:14px 16px;color:var(--muted)" x-text="s.next"></td>
              <td style="padding:14px 16px">
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                  <template x-for="r in s.recipients">
                    <span style="font-size:0.6875rem;padding:2px 8px;border-radius:9999px;background:var(--surface-2);color:var(--text)" x-text="r"></span>
                  </template>
                </div>
              </td>
              <td style="padding:14px 16px;text-align:center">
                <div @click="toggleActive(s.id)" :style="s.active ? 'background:#22c55e' : 'background:var(--border)'" style="width:36px;height:20px;border-radius:10px;position:relative;cursor:pointer;margin:0 auto;transition:background .2s">
                  <div :style="s.active ? 'transform:translateX(16px)' : 'transform:translateX(2px)'" style="width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .2s"></div>
                </div>
              </td>
              <td style="padding:14px 20px;text-align:center">
                <button @click="toggleEdit(s.id)" :style="s.editing ? 'color:#22c55e' : 'color:var(--muted)'" style="background:none;border:none;cursor:pointer;font-size:1rem">
                  <i class="ph" :class="s.editing ? 'ph-check' : 'ph-pencil-simple'"></i>
                </button>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('ai'));</script>
</body>
</html>
