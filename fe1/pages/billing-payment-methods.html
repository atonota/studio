<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Odeme Yontemleri — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/tokens.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main" x-data>
  <div class="fade-in" style="margin-bottom:24px">
    <h1 class="page-title">Odeme Yontemleri</h1>
    <p class="page-sub">Kayitli kartlar ve fatura bilgileri</p>
  </div>

  <div style="display:flex;flex-direction:column;gap:20px;max-width:600px">

    <!-- Current Card -->
    <div class="fade-in-d1 card" style="padding:20px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:40px;height:28px;border-radius:4px;background:linear-gradient(135deg,#1a1f71,#2a5fd7);display:flex;align-items:center;justify-content:center">
            <span style="font-size:0.625rem;font-weight:700;color:#fff;letter-spacing:0.05em">VISA</span>
          </div>
          <div>
            <div style="font-size:0.875rem;font-weight:500;color:var(--text)">Visa **** 4242</div>
            <div style="font-size:0.75rem;color:var(--muted)">Son kullanma: 08/27</div>
          </div>
        </div>
        <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e;font-size:0.6875rem">Varsayilan</span>
      </div>
      <div style="display:flex;justify-content:flex-end">
        <button style="background:none;border:none;color:#ef4444;font-size:0.8125rem;cursor:pointer;padding:4px 8px">Sil</button>
      </div>
    </div>

    <!-- Add New Card -->
    <div class="fade-in-d1">
      <button style="width:100%;padding:20px;border:2px dashed var(--border);border-radius:12px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:0.875rem;transition:border-color 0.2s"
        onmouseover="this.style.borderColor='var(--text)';this.style.color='var(--text)'"
        onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
        <i class="ph ph-plus" style="font-size:1.125rem"></i>
        Yeni Kart Ekle
      </button>
    </div>

    <!-- Billing Address -->
    <div class="fade-in-d2 card" style="padding:20px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
        <i class="ph ph-map-pin" style="color:var(--muted);font-size:1rem"></i>
        <span style="font-size:0.875rem;font-weight:600;color:var(--text)">Fatura Adresi</span>
      </div>
      <div style="font-size:0.8125rem;color:var(--muted);line-height:1.6">
        Acme Corp.<br>
        Levent Mah. Buyukdere Cad. No:123<br>
        Besiktas, Istanbul<br>
        Turkiye
      </div>
    </div>

  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('settings'));</script>
</body>
</html>
