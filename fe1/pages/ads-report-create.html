<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Yeni Reklam Raporu — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main">
  <!-- Header -->
  <div class="fade-in" style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
    <div style="width:40px;height:40px;border-radius:10px;background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center">
      <i class="ph ph-file-plus" style="color:#a855f7;font-size:1.25rem"></i>
    </div>
    <div>
      <h1 class="page-title">Yeni Reklam Raporu</h1>
      <p class="page-sub">Rapor parametrelerini yapilandirin</p>
    </div>
  </div>

  <!-- Form -->
  <div class="fade-in-d1 card" style="max-width:640px">
    <!-- Rapor Adi -->
    <div style="margin-bottom:24px">
      <label style="display:block;font-size:0.8125rem;font-weight:500;color:var(--text);margin-bottom:8px">Rapor Adi</label>
      <input type="text" placeholder="ornek: Mart 2026 Cross-Channel Raporu" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:0.875rem;font-family:inherit;outline:none">
    </div>

    <!-- Platform Secimi -->
    <div style="margin-bottom:24px">
      <label style="display:block;font-size:0.8125rem;font-weight:500;color:var(--text);margin-bottom:12px">Platform Secimi</label>
      <div style="display:flex;flex-direction:column;gap:10px">
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <i class="ph ph-meta-logo" style="color:#3b82f6;font-size:1rem"></i>
          <span style="font-size:0.875rem;color:var(--text)">Meta Ads</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <i class="ph ph-tiktok-logo" style="color:var(--text);font-size:1rem"></i>
          <span style="font-size:0.875rem;color:var(--text)">TikTok Ads</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent);width:16px;height:16px">
          <i class="ph ph-linkedin-logo" style="color:#3b82f6;font-size:1rem"></i>
          <span style="font-size:0.875rem;color:var(--text)">LinkedIn Ads</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:0.875rem;color:var(--text)">Tumu</span>
        </label>
      </div>
    </div>

    <!-- Donem -->
    <div style="margin-bottom:24px">
      <label style="display:block;font-size:0.8125rem;font-weight:500;color:var(--text);margin-bottom:8px">Donem</label>
      <select style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:0.875rem;font-family:inherit;outline:none">
        <option>Son 7 gun</option>
        <option selected>Son 30 gun</option>
        <option>Son 90 gun</option>
      </select>
    </div>

    <!-- Metrikler -->
    <div style="margin-bottom:24px">
      <label style="display:block;font-size:0.8125rem;font-weight:500;color:var(--text);margin-bottom:12px">Metrikler</label>
      <div style="display:flex;flex-wrap:wrap;gap:10px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:0.875rem;color:var(--text)">Harcama</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:0.875rem;color:var(--text)">ROAS</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:0.875rem;color:var(--text)">CPA</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:0.875rem;color:var(--text)">CTR</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:0.875rem;color:var(--text)">Donusum</span>
        </label>
      </div>
    </div>

    <!-- Format -->
    <div style="margin-bottom:24px">
      <label style="display:block;font-size:0.8125rem;font-weight:500;color:var(--text);margin-bottom:12px">Format</label>
      <div style="display:flex;gap:16px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="format" value="pdf" checked style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:0.875rem;color:var(--text)">PDF</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="format" value="html" style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:0.875rem;color:var(--text)">HTML</span>
        </label>
      </div>
    </div>

    <!-- White-label Toggle -->
    <div style="margin-bottom:28px;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:0.8125rem;font-weight:500;color:var(--text)">White-label</div>
        <div style="font-size:0.75rem;color:var(--muted)">atonota markasini gizle</div>
      </div>
      <div style="width:44px;height:24px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0">
        <div style="width:20px;height:20px;border-radius:50%;background:var(--muted);position:absolute;top:1px;left:2px"></div>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex;align-items:center;gap:12px;justify-content:flex-end">
      <button class="btn-secondary" style="padding:8px 20px;font-size:0.8125rem">Iptal</button>
      <button class="btn-primary" style="padding:8px 20px;font-size:0.8125rem"><i class="ph ph-sparkle" style="margin-right:4px"></i>Olustur</button>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('ads'));</script>
</body>
</html>
