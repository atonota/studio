<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Yeni Reklam Raporu — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="form" x-data="{
  reportName: '',
  errors: {},
  validate() {
    this.errors = {};
    if (!this.reportName.trim()) this.errors.reportName = 'Rapor adi zorunlu';
    return Object.keys(this.errors).length === 0;
  },
  submit() {
    if (this.validate()) { showToast && showToast('Rapor olusturuldu!', 'success'); }
  }
}">
  <!-- Header -->
  <div class="fade-in" style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-6)">
    <div style="width:40px;height:40px;border-radius:var(--r-md);background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center">
      <i class="ph ph-file-plus" style="color:#a855f7;font-size:var(--fs-xl)"></i>
    </div>
    <div>
      <h1 class="page-title">Yeni Reklam Raporu</h1>
      <p class="page-sub">Rapor parametrelerini yapilandirin</p>
    </div>
  </div>

  <!-- Form -->
  <div class="fade-in-d1 card" style="max-width:640px">
    <!-- Rapor Adi -->
    <div style="margin-bottom:var(--sp-6)">
      <label style="display:block;font-size:var(--fs-sm);font-weight:500;color:var(--text);margin-bottom:var(--sp-2)">Rapor Adi</label>
      <input type="text" x-model="reportName" placeholder="ornek: Mart 2026 Cross-Channel Raporu" style="width:100%;padding:var(--sp-3) var(--sp-3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-md);font-family:inherit;outline:none" :style="errors.reportName ? 'border-color:#ef4444' : ''">
      <span x-show="errors.reportName" x-text="errors.reportName" style="color:#ef4444;font-size:var(--fs-sm);margin-top:var(--sp-1);display:block"></span>
    </div>

    <!-- Platform Secimi -->
    <div style="margin-bottom:var(--sp-6)">
      <label style="display:block;font-size:var(--fs-sm);font-weight:500;color:var(--text);margin-bottom:var(--sp-3)">Platform Secimi</label>
      <div style="display:flex;flex-direction:column;gap:var(--sp-3)">
        <label style="display:flex;align-items:center;gap:var(--sp-3);cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <i class="ph ph-meta-logo" style="color:#3b82f6;font-size:var(--fs-lg)"></i>
          <span style="font-size:var(--fs-md);color:var(--text)">Meta Ads</span>
        </label>
        <label style="display:flex;align-items:center;gap:var(--sp-3);cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <i class="ph ph-tiktok-logo" style="color:var(--text);font-size:var(--fs-lg)"></i>
          <span style="font-size:var(--fs-md);color:var(--text)">TikTok Ads</span>
        </label>
        <label style="display:flex;align-items:center;gap:var(--sp-3);cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent);width:16px;height:16px">
          <i class="ph ph-linkedin-logo" style="color:#3b82f6;font-size:var(--fs-lg)"></i>
          <span style="font-size:var(--fs-md);color:var(--text)">LinkedIn Ads</span>
        </label>
        <label style="display:flex;align-items:center;gap:var(--sp-3);cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:var(--fs-md);color:var(--text)">Tumu</span>
        </label>
      </div>
    </div>

    <!-- Donem -->
    <div style="margin-bottom:var(--sp-6)">
      <label style="display:block;font-size:var(--fs-sm);font-weight:500;color:var(--text);margin-bottom:var(--sp-2)">Donem</label>
      <select style="width:100%;padding:var(--sp-3) var(--sp-3);border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:var(--fs-md);font-family:inherit;outline:none">
        <option>Son 7 gun</option>
        <option selected>Son 30 gun</option>
        <option>Son 90 gun</option>
      </select>
    </div>

    <!-- Metrikler -->
    <div style="margin-bottom:var(--sp-6)">
      <label style="display:block;font-size:var(--fs-sm);font-weight:500;color:var(--text);margin-bottom:var(--sp-3)">Metrikler</label>
      <div style="display:flex;flex-wrap:wrap;gap:var(--sp-3)">
        <label style="display:flex;align-items:center;gap:var(--sp-2);cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:var(--fs-md);color:var(--text)">Harcama</span>
        </label>
        <label style="display:flex;align-items:center;gap:var(--sp-2);cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:var(--fs-md);color:var(--text)">ROAS</span>
        </label>
        <label style="display:flex;align-items:center;gap:var(--sp-2);cursor:pointer">
          <input type="checkbox" checked style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:var(--fs-md);color:var(--text)">CPA</span>
        </label>
        <label style="display:flex;align-items:center;gap:var(--sp-2);cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:var(--fs-md);color:var(--text)">CTR</span>
        </label>
        <label style="display:flex;align-items:center;gap:var(--sp-2);cursor:pointer">
          <input type="checkbox" style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:var(--fs-md);color:var(--text)">Donusum</span>
        </label>
      </div>
    </div>

    <!-- Format -->
    <div style="margin-bottom:var(--sp-6)">
      <label style="display:block;font-size:var(--fs-sm);font-weight:500;color:var(--text);margin-bottom:var(--sp-3)">Format</label>
      <div style="display:flex;gap:var(--sp-4)">
        <label style="display:flex;align-items:center;gap:var(--sp-2);cursor:pointer">
          <input type="radio" name="format" value="pdf" checked style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:var(--fs-md);color:var(--text)">PDF</span>
        </label>
        <label style="display:flex;align-items:center;gap:var(--sp-2);cursor:pointer">
          <input type="radio" name="format" value="html" style="accent-color:var(--accent);width:16px;height:16px">
          <span style="font-size:var(--fs-md);color:var(--text)">HTML</span>
        </label>
      </div>
    </div>

    <!-- White-label Toggle -->
    <div style="margin-bottom:var(--sp-7);display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:var(--fs-sm);font-weight:500;color:var(--text)">White-label</div>
        <div style="font-size:var(--fs-sm);color:var(--muted)">atonota markasini gizle</div>
      </div>
      <div style="width:44px;height:24px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0">
        <div style="width:20px;height:20px;border-radius:50%;background:var(--muted);position:absolute;top:1px;left:2px"></div>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex;align-items:center;gap:var(--sp-3);justify-content:flex-end">
      <button class="btn-secondary" style="padding:var(--sp-2) var(--sp-5);font-size:var(--fs-sm)" onclick="history.back()">Iptal</button>
      <button class="btn-primary" style="padding:var(--sp-2) var(--sp-5);font-size:var(--fs-sm)" @click="submit()"><i class="ph ph-sparkle" style="margin-right:var(--sp-1)"></i>Olustur</button>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('ads'));</script>
</body>
</html>
