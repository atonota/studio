<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kreatif Yonetimi — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="table" x-data="{ viewMode: 'grid', platformFilter: 'tumu', sortBy: 'ctr' }">
  <!-- Header -->
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-6)">
    <div style="display:flex;align-items:center;gap:var(--sp-3)">
      <div style="width:40px;height:40px;border-radius:var(--r-md);background:rgba(249,115,22,0.1);display:flex;align-items:center;justify-content:center">
        <i class="ph ph-paint-brush" style="color:#f97316;font-size:var(--fs-xl)"></i>
      </div>
      <div>
        <h1 class="page-title">Kreatif Yonetimi</h1>
        <p class="page-sub">Reklam gorselleri ve performans</p>
      </div>
    </div>
    <button class="btn-primary"><i class="ph ph-upload-simple"></i> Kreatif Yukle</button>
  </div>

  <!-- Filters -->
  <div class="fade-in" style="display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-4);align-items:center">
    <div style="display:flex;gap:var(--sp-1);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden">
      <button @click="viewMode = 'grid'" :style="viewMode === 'grid' ? 'background:var(--accent);color:#fff' : 'background:var(--surface-2);color:var(--muted)'" style="padding:var(--sp-2) var(--sp-3);border:none;cursor:pointer;display:flex;align-items:center"><i class="ph ph-squares-four" style="font-size:var(--fs-lg)"></i></button>
      <button @click="viewMode = 'list'" :style="viewMode === 'list' ? 'background:var(--accent);color:#fff' : 'background:var(--surface-2);color:var(--muted)'" style="padding:var(--sp-2) var(--sp-3);border:none;cursor:pointer;display:flex;align-items:center"><i class="ph ph-list" style="font-size:var(--fs-lg)"></i></button>
    </div>
    <template x-for="p in [{v:'tumu',l:'Tumu'},{v:'Meta',l:'Meta'},{v:'LinkedIn',l:'LinkedIn'},{v:'TikTok',l:'TikTok'}]">
      <button @click="platformFilter = p.v" class="tab-btn" :class="platformFilter === p.v ? 'active' : ''" x-text="p.l"></button>
    </template>
    <select x-model="sortBy" style="padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-size:var(--fs-sm);font-family:inherit;cursor:pointer">
      <option value="ctr">CTR Sirala</option>
      <option value="gosterim">Gosterim Sirala</option>
    </select>
  </div>

  <!-- Creative Cards Grid -->
  <div class="fade-in-d1" :style="viewMode === 'grid' ? 'display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-4)' : 'display:flex;flex-direction:column;gap:var(--sp-3)'">
    <!-- Creative 1 -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="height:180px;background:var(--surface-2);display:flex;align-items:center;justify-content:center">
        <i class="ph ph-image" style="font-size:3rem;color:var(--border)"></i>
      </div>
      <div style="padding:var(--sp-4)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-2)">
          <div style="font-size:var(--fs-md);font-weight:500;color:var(--text)">Bahar Kampanyasi — Banner</div>
          <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">Meta</span>
        </div>
        <div style="display:flex;gap:var(--sp-4)">
          <div>
            <div style="font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">Gosterim</div>
            <div style="font-size:var(--fs-md);font-weight:500;color:var(--text)">124,800</div>
          </div>
          <div>
            <div style="font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">CTR</div>
            <div style="font-size:var(--fs-md);font-weight:500;color:#22c55e">2.4%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Creative 2 -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="height:180px;background:var(--surface-2);display:flex;align-items:center;justify-content:center">
        <i class="ph ph-image" style="font-size:3rem;color:var(--border)"></i>
      </div>
      <div style="padding:var(--sp-4)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-2)">
          <div style="font-size:var(--fs-md);font-weight:500;color:var(--text)">Urun Tanitimi — Carousel</div>
          <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">Meta</span>
        </div>
        <div style="display:flex;gap:var(--sp-4)">
          <div>
            <div style="font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">Gosterim</div>
            <div style="font-size:var(--fs-md);font-weight:500;color:var(--text)">89,200</div>
          </div>
          <div>
            <div style="font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">CTR</div>
            <div style="font-size:var(--fs-md);font-weight:500;color:#22c55e">3.1%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Creative 3 -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="height:180px;background:var(--surface-2);display:flex;align-items:center;justify-content:center">
        <i class="ph ph-image" style="font-size:3rem;color:var(--border)"></i>
      </div>
      <div style="padding:var(--sp-4)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-2)">
          <div style="font-size:var(--fs-md);font-weight:500;color:var(--text)">B2B Lead Gen — Video</div>
          <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">LinkedIn</span>
        </div>
        <div style="display:flex;gap:var(--sp-4)">
          <div>
            <div style="font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">Gosterim</div>
            <div style="font-size:var(--fs-md);font-weight:500;color:var(--text)">31,400</div>
          </div>
          <div>
            <div style="font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">CTR</div>
            <div style="font-size:var(--fs-md);font-weight:500;color:#eab308">1.2%</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Creative 4 -->
    <div class="card" style="padding:0;overflow:hidden">
      <div style="height:180px;background:var(--surface-2);display:flex;align-items:center;justify-content:center">
        <i class="ph ph-image" style="font-size:3rem;color:var(--border)"></i>
      </div>
      <div style="padding:var(--sp-4)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-2)">
          <div style="font-size:var(--fs-md);font-weight:500;color:var(--text)">Trend Dans — Short Video</div>
          <span class="badge" style="background:rgba(var(--text-rgb),0.1);color:var(--text)">TikTok</span>
        </div>
        <div style="display:flex;gap:var(--sp-4)">
          <div>
            <div style="font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">Gosterim</div>
            <div style="font-size:var(--fs-md);font-weight:500;color:var(--text)">215,600</div>
          </div>
          <div>
            <div style="font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">CTR</div>
            <div style="font-size:var(--fs-md);font-weight:500;color:#22c55e">4.7%</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('ads'));</script>
</body>
</html>
