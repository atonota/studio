<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Prompt Arastirma — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main" x-data="{
  search: '',
  platformFilter: 'tumu',
  statusFilter: 'tumu',
  rows: [
    {prompt:'en iyi SEO analiz araci hangisi',platform:'ChatGPT',durum:'Bahsedildi',tarih:'2 saat once'},
    {prompt:'WordPress icin reklam yonetim eklentisi',platform:'Gemini',durum:'Bahsedildi',tarih:'5 saat once'},
    {prompt:'cross-channel butce optimizasyonu nasil yapilir',platform:'Perplexity',durum:'Bahsedilmedi',tarih:'1 gun once'},
    {prompt:'e-ticaret reklam stratejisi 2026',platform:'Claude',durum:'Bahsedilmedi',tarih:'2 gun once'},
    {prompt:'Turkiye pazarinda dijital reklam araclari',platform:'ChatGPT',durum:'Bahsedildi',tarih:'3 gun once'}
  ],
  get filtered() {
    let r = this.rows;
    if (this.search) r = r.filter(x => x.prompt.toLowerCase().includes(this.search.toLowerCase()));
    if (this.platformFilter !== 'tumu') r = r.filter(x => x.platform === this.platformFilter);
    if (this.statusFilter !== 'tumu') r = r.filter(x => x.durum === this.statusFilter);
    return r;
  }
}">
  <div class="fade-in" style="margin-bottom:24px">
    <h1 class="page-title">Prompt Arastirma</h1>
    <p class="page-sub">AI platformlarinda kullanilan prompt analizi</p>
  </div>

  <!-- Search + Filters -->
  <div class="fade-in-d1" style="display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;align-items:center">
    <div style="position:relative;flex:1;max-width:480px">
      <i class="ph ph-magnifying-glass" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem"></i>
      <input type="text" x-model="search" placeholder="Prompt ara..." style="width:100%;padding:10px 14px 10px 40px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:0.875rem;outline:none;font-family:inherit">
    </div>
    <div style="display:flex;gap:4px">
      <template x-for="p in ['tumu','ChatGPT','Gemini','Perplexity','Claude']">
        <button @click="platformFilter = p" :style="platformFilter === p ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : 'background:var(--surface-2);color:var(--muted)'" style="padding:6px 12px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:all .15s" x-text="p === 'tumu' ? 'Tum Platform' : p"></button>
      </template>
    </div>
    <div style="display:flex;gap:4px">
      <template x-for="s in ['tumu','Bahsedildi','Bahsedilmedi']">
        <button @click="statusFilter = s" :style="statusFilter === s ? 'background:var(--accent);color:#fff;border-color:var(--accent)' : 'background:var(--surface-2);color:var(--muted)'" style="padding:6px 12px;border-radius:6px;font-size:0.75rem;font-weight:600;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:all .15s" x-text="s === 'tumu' ? 'Tum Durum' : s"></button>
      </template>
    </div>
  </div>

  <!-- Stat Cards -->
  <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px">
    <div class="stat-card" style="--stripe:#3b82f6">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Toplam Prompt</span>
      <div style="font-size:1.75rem;font-weight:300;color:var(--text);margin-top:8px">2,847</div>
    </div>
    <div class="stat-card" style="--stripe:#22c55e">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Markayi Iceren</span>
      <div style="font-size:1.75rem;font-weight:300;color:#22c55e;margin-top:8px">23</div>
    </div>
    <div class="stat-card" style="--stripe:#ef4444">
      <span style="font-size:0.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Rakip Prompt</span>
      <div style="font-size:1.75rem;font-weight:300;color:#ef4444;margin-top:8px">142</div>
    </div>
  </div>

  <!-- Prompts Table -->
  <div class="fade-in-d2 card" style="padding:0;overflow:hidden">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
      <span class="section-label" style="margin-bottom:0">Son Promptlar</span>
    </div>
    <table class="r-table">
      <thead>
        <tr>
          <th>Prompt</th>
          <th>Platform</th>
          <th>Durum</th>
          <th>Tarih</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in filtered" :key="row.prompt">
          <tr>
            <td data-label="Prompt"><span style="font-weight:500;color:var(--text)" x-text="row.prompt"></span></td>
            <td data-label="Platform" x-text="row.platform"></td>
            <td data-label="Durum"><span class="badge" :style="row.durum==='Bahsedildi' ? 'background:rgba(34,197,94,0.1);color:#22c55e' : 'background:rgba(239,68,68,0.1);color:#ef4444'" x-text="row.durum"></span></td>
            <td data-label="Tarih" style="font-size:0.8125rem;color:var(--muted)" x-text="row.tarih"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('seo'));</script>
</body>
</html>
