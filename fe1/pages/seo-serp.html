<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SERP Feature Takibi — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>
<div id="main" data-skeleton="tool" x-data="{
  featureFilter: 'tumu',
  sortCol: '',
  sortDir: 'asc',
  rows: [
    {kw:'dijital pazarlama nedir',poz:3,won:['Featured Snippet','PAA'],lost:[]},
    {kw:'seo araci karsilastirma',poz:5,won:['Video Carousel'],lost:['Featured Snippet']},
    {kw:'backlink analizi nasil yapilir',poz:2,won:['Featured Snippet','PAA','Video Carousel'],lost:[]},
    {kw:'google ads butce yonetimi',poz:8,won:['PAA'],lost:['Knowledge Panel']},
    {kw:'wordpress seo ayarlari',poz:4,won:['Featured Snippet'],lost:['PAA','Video Carousel']},
    {kw:'icerik pazarlama stratejisi',poz:6,won:['PAA','Knowledge Panel'],lost:[]}
  ],
  get allFeatures() { return ['Featured Snippet','PAA','Knowledge Panel','Video Carousel']; },
  get filtered() {
    let r = this.rows;
    if (this.featureFilter !== 'tumu') r = r.filter(x => x.won.includes(this.featureFilter) || x.lost.includes(this.featureFilter));
    if (this.sortCol === 'poz') {
      r = [...r].sort((a,b) => this.sortDir === 'asc' ? a.poz - b.poz : b.poz - a.poz);
    } else if (this.sortCol === 'kw') {
      r = [...r].sort((a,b) => { let c = a.kw.localeCompare(b.kw,'tr'); return this.sortDir === 'asc' ? c : -c; });
    }
    return r;
  },
  doSort(col) {
    if (this.sortCol === col) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
    else { this.sortCol = col; this.sortDir = 'asc'; }
  }
}">
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">SERP Feature Takibi</h1>
    <p class="page-sub">Arama sonucu zengin ozelliklerinin izlenmesi</p>
  </div>

  <!-- Stat Cards -->
  <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4);margin-bottom:var(--sp-6)">
    <div class="stat-card" style="--stripe:#3b82f6">
      <span style="font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Featured Snippet</span>
      <div style="font-size:var(--fs-3xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)">7</div>
    </div>
    <div class="stat-card" style="--stripe:#a855f7">
      <span style="font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">PAA</span>
      <div style="font-size:var(--fs-3xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)">12</div>
    </div>
    <div class="stat-card" style="--stripe:#22c55e">
      <span style="font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Knowledge Panel</span>
      <div style="font-size:var(--fs-3xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)">1</div>
    </div>
    <div class="stat-card" style="--stripe:#eab308">
      <span style="font-size:var(--fs-sm);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">Video Carousel</span>
      <div style="font-size:var(--fs-3xl);font-weight:300;color:var(--text);margin-top:var(--sp-2)">3</div>
    </div>
  </div>

  <!-- Feature Filter -->
  <div class="fade-in-d2" style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4);flex-wrap:wrap">
    <button @click="featureFilter = 'tumu'" class="tab-btn" :class="featureFilter === 'tumu' ? 'active' : ''">Tumu</button>
    <template x-for="feat in allFeatures">
      <button @click="featureFilter = feat" class="tab-btn" :class="featureFilter === feat ? 'active' : ''" x-text="feat"></button>
    </template>
  </div>

  <!-- SERP Features Table -->
  <div class="fade-in-d2 card" data-paginate="20" style="padding:0;overflow:hidden">
    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span class="section-label" style="margin-bottom:0">Keyword SERP Ozellikleri</span>
      <button class="btn-secondary" style="font-size:var(--fs-sm);padding:var(--sp-2) var(--sp-3)" onclick="exportToCSV('serp-features',['Keyword','Pozisyon','Kazanilan','Kaybedilen'])">CSV Indir</button>
    </div>
    <table class="r-table">
      <thead>
        <tr>
          <th @click="doSort('kw')" style="cursor:pointer">Keyword <i class="ph" :class="sortCol==='kw' ? (sortDir==='asc' ? 'ph-caret-up' : 'ph-caret-down') : 'ph-caret-up-down'" style="font-size:var(--fs-2xs);opacity:0.5"></i></th>
          <th @click="doSort('poz')" style="cursor:pointer">Pozisyon <i class="ph" :class="sortCol==='poz' ? (sortDir==='asc' ? 'ph-caret-up' : 'ph-caret-down') : 'ph-caret-up-down'" style="font-size:var(--fs-2xs);opacity:0.5"></i></th>
          <th>Kazanilan</th>
          <th>Kaybedilen</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in filtered" :key="row.kw">
          <tr>
            <td data-label="Keyword"><span style="font-weight:500;color:var(--text)" x-text="row.kw"></span></td>
            <td data-label="Pozisyon"><span style="color:var(--text)" x-text="row.poz"></span></td>
            <td data-label="Kazanilan">
              <div style="display:flex;gap:var(--sp-1);flex-wrap:wrap">
                <template x-if="row.won.length === 0"><span style="color:var(--muted);font-size:var(--fs-sm)">—</span></template>
                <template x-for="w in row.won" :key="w">
                  <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e" x-text="w"></span>
                </template>
              </div>
            </td>
            <td data-label="Kaybedilen">
              <div style="display:flex;gap:var(--sp-1);flex-wrap:wrap">
                <template x-if="row.lost.length === 0"><span style="color:var(--muted);font-size:var(--fs-sm)">—</span></template>
                <template x-for="l in row.lost" :key="l">
                  <span class="badge" style="background:rgba(239,68,68,0.1);color:#ef4444" x-text="l"></span>
                </template>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('seo'));</script>
</body>
</html>
