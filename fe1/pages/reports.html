<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Raporlar — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="dashboard" x-data="{
  reports: [
    { id:1, name:'Haftalik SEO Raporu', type:'PDF — Otomatik', icon:'ph-file-pdf', iconColor:'#ef4444', iconBg:'rgba(239,68,68,0.1)', schedule:'Her Pzt 09:00', lastRun:'25 Mar 2026', active:true },
    { id:2, name:'Aylik Performans', type:'PDF — Otomatik', icon:'ph-file-pdf', iconColor:'#ef4444', iconBg:'rgba(239,68,68,0.1)', schedule:'Her ayin 1\'i', lastRun:'1 Mar 2026', active:true },
    { id:3, name:'Reklam ROAS Raporu', type:'HTML — Manuel, White-label', icon:'ph-file-html', iconColor:'#3b82f6', iconBg:'rgba(59,130,246,0.1)', schedule:'Manuel', lastRun:'—', active:false }
  ]
}">
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-6)">
    <div>
      <h1 class="page-title">Raporlar</h1>
      <p class="page-sub">Otomatik ve manuel rapor yonetimi</p>
    </div>
    <a href="report-create.html" class="btn-primary" style="text-decoration:none"><i class="ph ph-plus"></i> Yeni Rapor</a>
  </div>

  <div class="fade-in-d1" style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-4)">
    <template x-for="r in reports" :key="r.id">
      <div class="card" style="display:flex;flex-direction:column;gap:var(--sp-3)">
        <div style="display:flex;align-items:center;gap:var(--sp-3)">
          <div :style="'width:36px;height:36px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;background:'+r.iconBg">
            <i class="ph" :class="r.icon" :style="'color:'+r.iconColor+';font-size:var(--fs-lg)'"></i>
          </div>
          <div>
            <div style="font-weight:500;color:var(--text)" x-text="r.name"></div>
            <div style="font-size:var(--fs-xs);color:var(--muted)" x-text="r.type"></div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:var(--sp-2)">
          <div style="display:flex;justify-content:space-between">
            <span style="font-size:var(--fs-sm);color:var(--muted)">Zamanlama</span>
            <span style="font-size:var(--fs-sm);color:var(--text)" x-text="r.schedule"></span>
          </div>
          <div style="display:flex;justify-content:space-between">
            <span style="font-size:var(--fs-sm);color:var(--muted)">Son Calistirma</span>
            <span style="font-size:var(--fs-sm);color:var(--text)" x-text="r.lastRun"></span>
          </div>
        </div>
        <!-- Status Toggle -->
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="badge" :style="r.active ? 'background:rgba(34,197,94,0.1);color:#22c55e' : 'background:rgba(234,179,8,0.1);color:#eab308'" x-text="r.active ? 'Aktif' : 'Pasif'"></span>
          <div @click="r.active = !r.active; $store.toast.show(r.active ? 'Rapor aktif edildi' : 'Rapor durduruldu', r.active ? 'success' : 'warning')"
            :style="'width:44px;height:24px;border-radius:var(--r-lg);position:relative;cursor:pointer;transition:background 0.2s;background:'+(r.active ? 'var(--accent)' : 'var(--border)')">
            <div :style="'width:20px;height:20px;border-radius:50%;background:white;position:absolute;top:2px;transition:left 0.2s;'+(r.active ? 'left:22px' : 'left:2px')"></div>
          </div>
        </div>
        <!-- Actions -->
        <div style="display:flex;gap:var(--sp-2);margin-top:var(--sp-1)">
          <button class="btn-secondary" style="flex:1;padding:var(--sp-2);font-size:var(--fs-sm)" @click="$store.toast.show('Rapor indiriliyor...', 'info')"><i class="ph ph-download-simple"></i> PDF Indir</button>
        </div>
      </div>
    </template>
  </div>
</div>

<div id="footbar"></div>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('reports'));</script>
</body>
</html>
