<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Rakip Uyarilari — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="table" x-data="{
  severity: 'tumu',
  alerts: [
    { id:1, title:'rakip1.com 3 yeni backlink kazandi', desc:'Kaynak domainler: techblog.com, dijitalajans.net, seoforum.com.tr', time:'1 saat once', icon:'ph-link', color:'#3b82f6', severity:'yuksek', dismissed:false },
    { id:2, title:'rakip2.com blog yazisi yayinladi: SEO Trendleri', desc:'2.400 kelime, 12 anahtar kelime hedefliyor', time:'3 saat once', icon:'ph-article', color:'#a855f7', severity:'orta', dismissed:false },
    { id:3, title:'rakip1.com DA 62 → 63 yukseldi', desc:'Domain Authority artisi, backlink profilindeki buyumeden kaynakli', time:'1 gun once', icon:'ph-trend-up', color:'#22c55e', severity:'yuksek', dismissed:false },
    { id:4, title:'rakip3.com sayfa hizi iyilesti: LCP 3.2s → 1.8s', desc:'Core Web Vitals skoru onemli olcude iyilesti', time:'2 gun once', icon:'ph-lightning', color:'#eab308', severity:'dusuk', dismissed:false }
  ],
  get filtered() {
    return this.alerts.filter(a => !a.dismissed && (this.severity === 'tumu' || a.severity === this.severity));
  },
  dismiss(id) {
    const a = this.alerts.find(x => x.id === id);
    if (a) { a.dismissed = true; $store.toast.show('Uyari kaldirildi', 'success'); }
  }
}">
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">Rakip Uyarilari</h1>
    <p class="page-sub">Rakiplerinizin son hareketleri</p>
  </div>

  <!-- Severity Filter -->
  <div class="fade-in" style="display:flex;gap:var(--sp-2);margin-bottom:var(--sp-4)">
    <template x-for="pill in [{v:'tumu',l:'Tumu'},{v:'yuksek',l:'Yuksek'},{v:'orta',l:'Orta'},{v:'dusuk',l:'Dusuk'}]">
      <button @click="severity=pill.v" class="pill" :class="severity===pill.v ? 'active' : ''" x-text="pill.l"></button>
    </template>
  </div>

  <!-- Alert Cards -->
  <div class="fade-in-d1" style="display:flex;flex-direction:column;gap:var(--sp-3)">
    <template x-for="a in filtered" :key="a.id">
      <div class="card" style="display:flex;align-items:flex-start;gap:var(--sp-4)" x-transition>
        <div :style="'width:40px;height:40px;border-radius:var(--r-md);background:'+a.color+'18;display:flex;align-items:center;justify-content:center;flex-shrink:0'">
          <i class="ph" :class="a.icon" :style="'color:'+a.color+';font-size:var(--fs-xl)'"></i>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:var(--fs-md);font-weight:500;color:var(--text)" x-text="a.title"></div>
          <div style="font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-1)" x-text="a.desc"></div>
        </div>
        <span style="font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;flex-shrink:0" x-text="a.time"></span>
        <button @click="dismiss(a.id)" style="background:none;border:none;cursor:pointer;padding:var(--sp-1);color:var(--muted);flex-shrink:0" title="Kaldir">
          <i class="ph ph-x" style="font-size:var(--fs-lg)"></i>
        </button>
      </div>
    </template>
    <div x-show="filtered.length===0" style="text-align:center;padding:40px;color:var(--muted);font-size:var(--fs-md)">
      <i class="ph ph-bell-slash" style="font-size:var(--fs-4xl);display:block;margin-bottom:var(--sp-2);opacity:0.5"></i>
      Uyari bulunmuyor
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('analytics'));</script>
</body>
</html>
