<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SSL/TLS Sertifika — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main" x-data="{ expanded: false, renewing: false }">
  <div class="fade-in" style="margin-bottom:24px">
    <h1 class="page-title">SSL/TLS Sertifika</h1>
    <p class="page-sub">Sertifika durumu ve detaylari</p>
  </div>

  <!-- Large Status Card -->
  <div class="fade-in-d1 card" style="text-align:center;padding:32px 20px;margin-bottom:24px;border-top:3px solid #22c55e">
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
      <i class="ph ph-shield-check" style="color:#22c55e;font-size:2rem"></i>
    </div>
    <div style="font-size:2rem;font-weight:200;color:#22c55e">Valid — A+</div>
    <div style="font-size:0.8125rem;color:var(--muted);margin-top:8px">SSL Labs derecelendirmesi</div>
  </div>

  <!-- Detail Rows -->
  <div class="fade-in-d2 card" style="padding:0;overflow:hidden">
    <div @click="expanded = !expanded" style="padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between">
      <span class="section-label" style="margin-bottom:0">Sertifika Detaylari</span>
      <i class="ph" :class="expanded ? 'ph-caret-up' : 'ph-caret-down'" style="color:var(--muted)"></i>
    </div>

    <div x-show="expanded" x-transition style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:0.8125rem;color:var(--muted)">Veren</span>
      <span style="font-size:0.8125rem;font-weight:500;color:var(--text)">Let's Encrypt</span>
    </div>
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:0.8125rem;color:var(--muted)">Protokol</span>
      <span style="font-size:0.8125rem;font-weight:500;color:var(--text)">TLS 1.3</span>
    </div>
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:0.8125rem;color:var(--muted)">HSTS</span>
      <span style="font-size:0.6875rem;padding:2px 10px;border-radius:9999px;background:rgba(34,197,94,0.1);color:#22c55e;font-weight:600">Aktif</span>
    </div>
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:0.8125rem;color:var(--muted)">OCSP Stapling</span>
      <span style="font-size:0.6875rem;padding:2px 10px;border-radius:9999px;background:rgba(34,197,94,0.1);color:#22c55e;font-weight:600">Aktif</span>
    </div>
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:0.8125rem;color:var(--muted)">Certificate Transparency</span>
      <span style="font-size:0.6875rem;padding:2px 10px;border-radius:9999px;background:rgba(34,197,94,0.1);color:#22c55e;font-weight:600">Aktif</span>
    </div>
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:0.8125rem;color:var(--muted)">Son Gecerlilik</span>
      <span style="font-size:0.8125rem;font-weight:500;color:var(--text)">15 Haziran 2026</span>
    </div>
    <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:0.8125rem;color:var(--muted)">Kalan Gun</span>
      <span style="font-size:0.8125rem;font-weight:500;color:#22c55e">80 gun</span>
    </div>
    <div style="padding:16px 20px;display:flex;justify-content:flex-end">
      <button @click="renewing = true; setTimeout(() => { renewing = false; $store.toast.show('SSL sertifikasi yenilendi', 'success') }, 2000)" :disabled="renewing" style="background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:0.8125rem;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:inherit" :style="renewing && 'opacity:0.7'">
        <i class="ph" :class="renewing ? 'ph-spinner' : 'ph-arrows-clockwise'" :style="renewing && 'animation:spin 1s linear infinite'" style="font-size:1rem"></i>
        <span x-text="renewing ? 'Yenileniyor...' : 'Yenile'"></span>
      </button>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('security'));</script>
<style>@keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }</style>
</body>
</html>
