<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>SSL/TLS Sertifika — atonota Studio</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="table" x-data="{ expanded: false, renewing: false }">
  <div class="fade-in" style="margin-bottom:var(--sp-6)">
    <h1 class="page-title">SSL/TLS Sertifika</h1>
    <p class="page-sub">Sertifika durumu ve detaylari</p>
  </div>

  <!-- Large Status Card -->
  <div class="fade-in-d1 card" style="text-align:center;padding:var(--sp-8) var(--sp-5);margin-bottom:var(--sp-6);border-top:3px solid #22c55e">
    <div style="width:64px;height:64px;border-radius:50%;background:rgba(34,197,94,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-4)">
      <i class="ph ph-shield-check" style="color:#22c55e;font-size:var(--fs-4xl)"></i>
    </div>
    <div style="font-size:var(--fs-4xl);font-weight:200;color:#22c55e">Valid — A+</div>
    <div style="font-size:var(--fs-sm);color:var(--muted);margin-top:var(--sp-2)">SSL Labs derecelendirmesi</div>
  </div>

  <!-- Detail Rows -->
  <div class="fade-in-d2 card" style="padding:0;overflow:hidden">
    <div @click="expanded = !expanded" style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:space-between">
      <span class="section-label" style="margin-bottom:0">Sertifika Detaylari</span>
      <i class="ph" :class="expanded ? 'ph-caret-up' : 'ph-caret-down'" style="color:var(--muted)"></i>
    </div>

    <div x-show="expanded" x-transition style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:var(--fs-sm);color:var(--muted)">Veren</span>
      <span style="font-size:var(--fs-sm);font-weight:500;color:var(--text)">Let's Encrypt</span>
    </div>
    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:var(--fs-sm);color:var(--muted)">Protokol</span>
      <span style="font-size:var(--fs-sm);font-weight:500;color:var(--text)">TLS 1.3</span>
    </div>
    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:var(--fs-sm);color:var(--muted)">HSTS</span>
      <span style="font-size:var(--fs-xs);padding:2px var(--sp-3);border-radius:var(--r-full);background:rgba(34,197,94,0.1);color:#22c55e;font-weight:600">Aktif</span>
    </div>
    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:var(--fs-sm);color:var(--muted)">OCSP Stapling</span>
      <span style="font-size:var(--fs-xs);padding:2px var(--sp-3);border-radius:var(--r-full);background:rgba(34,197,94,0.1);color:#22c55e;font-weight:600">Aktif</span>
    </div>
    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:var(--fs-sm);color:var(--muted)">Certificate Transparency</span>
      <span style="font-size:var(--fs-xs);padding:2px var(--sp-3);border-radius:var(--r-full);background:rgba(34,197,94,0.1);color:#22c55e;font-weight:600">Aktif</span>
    </div>
    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:var(--fs-sm);color:var(--muted)">Son Gecerlilik</span>
      <span style="font-size:var(--fs-sm);font-weight:500;color:var(--text)">15 Haziran 2026</span>
    </div>
    <div style="padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:var(--fs-sm);color:var(--muted)">Kalan Gun</span>
      <span style="font-size:var(--fs-sm);font-weight:500;color:#22c55e">80 gun</span>
    </div>
    <div style="padding:var(--sp-4) var(--sp-5);display:flex;justify-content:flex-end">
      <button @click="renewing = true; setTimeout(() => { renewing = false; $store.toast.show('SSL sertifikasi yenilendi', 'success') }, 2000)" :disabled="renewing" style="background:var(--accent);color:#fff;border:none;padding:var(--sp-3) var(--sp-5);border-radius:var(--r-md);font-size:var(--fs-sm);font-weight:500;cursor:pointer;display:flex;align-items:center;gap:var(--sp-2);font-family:inherit" :style="renewing && 'opacity:0.7'">
        <i class="ph" :class="renewing ? 'ph-spinner' : 'ph-arrows-clockwise'" :style="renewing && 'animation:spin 1s linear infinite'" style="font-size:var(--fs-lg)"></i>
        <span x-text="renewing ? 'Yenileniyor...' : 'Yenile'"></span>
      </button>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('analytics'));</script>
<style>@keyframes spin { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }</style>
</body>
</html>
