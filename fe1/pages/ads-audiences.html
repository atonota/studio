<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Hedef Kitle Yonetimi — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<link rel="stylesheet" href="../css/tokens.css">
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide" class="open"></div>

<div id="main">
  <!-- Header -->
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:10px;background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center">
        <i class="ph ph-users-three" style="color:#a855f7;font-size:1.25rem"></i>
      </div>
      <div>
        <h1 class="page-title">Hedef Kitle Yonetimi</h1>
        <p class="page-sub">Kitle segmentleri ve hedefleme</p>
      </div>
    </div>
    <button class="btn-primary"><i class="ph ph-plus"></i> Yeni Kitle</button>
  </div>

  <!-- Audience Cards -->
  <div class="fade-in-d1" style="display:flex;flex-direction:column;gap:16px">
    <!-- Audience 1 -->
    <div class="card" style="padding:20px 24px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="width:36px;height:36px;border-radius:8px;background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-users" style="color:#3b82f6;font-size:1.125rem"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">Turkiye E-ticaret 25-44</div>
              <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">Custom</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:16px;font-size:0.8125rem;color:var(--muted);margin-bottom:12px">
            <span><i class="ph ph-users" style="margin-right:4px"></i>2.4M kisi</span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">Meta</span>
            <span class="badge" style="background:rgba(123,114,105,0.1);color:var(--text)">TikTok</span>
          </div>
        </div>
        <button class="btn-secondary" style="padding:6px 16px;font-size:0.8125rem;flex-shrink:0">Duzenle</button>
      </div>
    </div>

    <!-- Audience 2 -->
    <div class="card" style="padding:20px 24px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="width:36px;height:36px;border-radius:8px;background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-copy" style="color:#a855f7;font-size:1.125rem"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">B2B IT Karar Verici</div>
              <span class="badge" style="background:rgba(168,85,247,0.1);color:#a855f7">Lookalike</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:16px;font-size:0.8125rem;color:var(--muted);margin-bottom:12px">
            <span><i class="ph ph-users" style="margin-right:4px"></i>180K kisi</span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">LinkedIn</span>
          </div>
        </div>
        <button class="btn-secondary" style="padding:6px 16px;font-size:0.8125rem;flex-shrink:0">Duzenle</button>
      </div>
    </div>

    <!-- Audience 3 -->
    <div class="card" style="padding:20px 24px">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="width:36px;height:36px;border-radius:8px;background:rgba(34,197,94,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-arrow-counter-clockwise" style="color:#22c55e;font-size:1.125rem"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">Retargeting 30 Gun</div>
              <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Website</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:16px;font-size:0.8125rem;color:var(--muted);margin-bottom:12px">
            <span><i class="ph ph-users" style="margin-right:4px"></i>45K kisi</span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">Meta</span>
          </div>
        </div>
        <button class="btn-secondary" style="padding:6px 16px;font-size:0.8125rem;flex-shrink:0">Duzenle</button>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('ads'));</script>
</body>
</html>
