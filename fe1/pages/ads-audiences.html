<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Hedef Kitle Yonetimi — atonota Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="stylesheet" href="../css/primitives.css">
<link rel="stylesheet" href="../css/tokens.css">
<script src="../js/appearance-store.js"></script>
<script src="../js/appearance-init.js"></script>
</head>
<body>
<div id="topbar"></div>
<div id="spotlight-backdrop"></div>
<div id="ud-backdrop"></div>
<nav id="rail" role="navigation" aria-label="Ana navigasyon"></nav>
<div id="wide-overlay"></div>
<div id="sidebar-wide"></div>

<div id="main" data-skeleton="table">
  <!-- Header -->
  <div class="fade-in" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--sp-6)">
    <div style="display:flex;align-items:center;gap:var(--sp-3)">
      <div style="width:40px;height:40px;border-radius:var(--r-md);background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center">
        <i class="ph ph-users-three" style="color:#a855f7;font-size:var(--fs-xl)"></i>
      </div>
      <div>
        <h1 class="page-title">Hedef Kitle Yonetimi</h1>
        <p class="page-sub">Kitle segmentleri ve hedefleme</p>
      </div>
    </div>
    <button class="btn-primary"><i class="ph ph-plus"></i> Yeni Kitle</button>
  </div>

  <!-- Audience Cards -->
  <div class="fade-in-d1" style="display:flex;flex-direction:column;gap:var(--sp-4)">
    <!-- Audience 1 -->
    <div class="card" style="padding:var(--sp-5) var(--sp-6)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)">
            <div style="width:36px;height:36px;border-radius:var(--r-md);background:rgba(59,130,246,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-users" style="color:#3b82f6;font-size:var(--fs-lg)"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">Turkiye E-ticaret 25-44</div>
              <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">Custom</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:var(--sp-4);font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--sp-3)">
            <span><i class="ph ph-users" style="margin-right:var(--sp-1)"></i>2.4M kisi</span>
          </div>
          <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">
            <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">Meta</span>
            <span class="badge" style="background:rgba(123,114,105,0.1);color:var(--text)">TikTok</span>
          </div>
        </div>
        <button class="btn-secondary" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);flex-shrink:0">Duzenle</button>
      </div>
    </div>

    <!-- Audience 2 -->
    <div class="card" style="padding:var(--sp-5) var(--sp-6)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)">
            <div style="width:36px;height:36px;border-radius:var(--r-md);background:rgba(168,85,247,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-copy" style="color:#a855f7;font-size:var(--fs-lg)"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">B2B IT Karar Verici</div>
              <span class="badge" style="background:rgba(168,85,247,0.1);color:#a855f7">Lookalike</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:var(--sp-4);font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--sp-3)">
            <span><i class="ph ph-users" style="margin-right:var(--sp-1)"></i>180K kisi</span>
          </div>
          <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">
            <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">LinkedIn</span>
          </div>
        </div>
        <button class="btn-secondary" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);flex-shrink:0">Duzenle</button>
      </div>
    </div>

    <!-- Audience 3 -->
    <div class="card" style="padding:var(--sp-5) var(--sp-6)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <div style="display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)">
            <div style="width:36px;height:36px;border-radius:var(--r-md);background:rgba(34,197,94,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <i class="ph ph-arrow-counter-clockwise" style="color:#22c55e;font-size:var(--fs-lg)"></i>
            </div>
            <div>
              <div style="font-weight:500;color:var(--text)">Retargeting 30 Gun</div>
              <span class="badge" style="background:rgba(34,197,94,0.1);color:#22c55e">Website</span>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:var(--sp-4);font-size:var(--fs-sm);color:var(--muted);margin-bottom:var(--sp-3)">
            <span><i class="ph ph-users" style="margin-right:var(--sp-1)"></i>45K kisi</span>
          </div>
          <div style="display:flex;gap:var(--sp-2);flex-wrap:wrap">
            <span class="badge" style="background:rgba(59,130,246,0.1);color:#3b82f6">Meta</span>
          </div>
        </div>
        <button class="btn-secondary" style="padding:var(--sp-2) var(--sp-4);font-size:var(--fs-sm);flex-shrink:0">Duzenle</button>
      </div>
    </div>
  </div>
</div>

<div id="footbar"></div>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
<script src="../js/components.js"></script>
<script src="../js/shell.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => initShell('ads'));</script>
</body>
</html>
