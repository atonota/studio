<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafb">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/static/manifest.json">
    <title>{% block title %}atonota Studio{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
    <style>
        /* atonota Global Rules */
        /* Min font-weight: 300 (light). Never thinner. */
        * { font-weight: max(var(--tw-font-weight, inherit), 300) !important; }
        body { font-weight: 300; }
        h1, h2, h3, h4, h5, h6, th, strong, b, .font-bold, .font-semibold, .font-medium {
            font-weight: revert !important;
        }

        /* Min font-size: 15px. Never smaller. */
        body { font-size: 15px; line-height: 1.6; }
        p, span, a, li, td, th, label, input, select, textarea, button, div {
            font-size: max(inherit, 15px);
        }
        /* Exceptions: badges, tags keep slightly smaller but still readable */
        .badge-sm, [class*="rounded-full"][class*="px-2"] {
            font-size: 13px !important;
        }

        /* Phosphor Icons: ensure visibility */
        .ph, [class*="ph-"] {
            font-size: 1.25em;
            vertical-align: middle;
        }

        /* Min viewport: 320px (iPhone 5s/SE1). No horizontal scroll. */
        html {
            min-width: 320px;
            overflow-x: hidden;
        }
        body {
            min-width: 320px;
        }
        /* Prevent content overflow on tiny screens */
        img, video, iframe, table, pre, code {
            max-width: 100%;
            overflow-x: auto;
        }

        /* Mobile-first: touch targets min 44px (WCAG 2.5.8) */
        a, button, [role="button"], input[type="checkbox"], input[type="radio"] {
            min-height: 44px;
            min-width: 44px;
        }

        /* Ultra-small screens (320-374px): tighter spacing */
        @media (max-width: 374px) {
            body { font-size: 14px; }
            .container, .content-area { padding-left: 0.5rem; padding-right: 0.5rem; }
            h1 { font-size: 1.25rem; }
            h2 { font-size: 1.125rem; }
            /* Stack all grid items single column */
            .grid { grid-template-columns: 1fr !important; }
            /* Spotlight search: full bleed on tiny screens */
            .spotlight-card { margin: 0; border-radius: 0; max-width: 100vw; }
        }

        /* Mobile-first: tables -> cards on small screens */
        @media (max-width: 767px) {
            .responsive-table { display: block; }
            .responsive-table thead { display: none; }
            .responsive-table tr {
                display: block;
                margin-bottom: 0.5rem;
                border: 1px solid #374151;
                border-radius: 0.5rem;
                padding: 0.75rem;
            }
            .responsive-table td {
                display: flex;
                justify-content: space-between;
                padding: 0.25rem 0;
                border: none;
            }
            .responsive-table td::before {
                content: attr(data-label);
                font-weight: 500;
                color: #9ca3af;
            }
        }

        /* === Cross-Platform Uyumluluk === */

        /* iOS safe-area (notch, Dynamic Island, home indicator) */
        .app-container {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Dynamic viewport height (iOS 100vh bug fix) */
        .full-height {
            height: 100dvh;
            height: 100vh; /* fallback */
        }

        /* Tap highlight kaldır (app hissi) */
        * { -webkit-tap-highlight-color: transparent; }

        /* Touch scroll momentum (iOS) */
        .scrollable { -webkit-overflow-scrolling: touch; }

        /* App-mode: no-select for UI elements (not content) */
        .no-select {
            -webkit-user-select: none;
            user-select: none;
        }

        /* iOS input zoom prevention: min 16px for inputs */
        @media (max-width: 767px) {
            input, select, textarea { font-size: 16px !important; }
        }

        /* Reduced motion: respect user preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Forced colors (Windows High Contrast) */
        @media (forced-colors: active) {
            .badge-sm, .status-badge {
                border: 1px solid currentColor;
            }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 dark:bg-gray-900">
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
