{% extends "layouts/base.html" %}

{% block title %}Plugin'ler — atonota Studio{% endblock %}

{% block content %}
<div class="flex h-screen">
    {% include "partials/sidebar.html" %}

    <main class="flex-1 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Plugin'ler</h2>
                <p class="text-gray-500 dark:text-gray-400">Platform plugin kayıt defteri</p>
            </div>
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="ph ph-plus"></i> Yeni Plugin
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
             hx-get="/api/v1/partials/plugin-cards"
             hx-trigger="load"
             hx-swap="innerHTML">
            {% for i in range(6) %}
            <div class="bg-white dark:bg-gray-800 rounded-lg p-5 shadow animate-pulse">
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-2/3 mb-3"></div>
                <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-1/2 mb-2"></div>
                <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-1/3"></div>
            </div>
            {% endfor %}
        </div>
    </main>
</div>
{% endblock %}
