{% extends "layouts/base.html" %}

{% block title %}Dashboard — atonota Studio{% endblock %}

{% block content %}
<div class="flex h-screen">
    {% include "partials/sidebar.html" %}

    <!-- Main content -->
    <main class="flex-1 p-6 overflow-y-auto">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Dashboard</h2>
            <p class="text-gray-500 dark:text-gray-400">Platform genel durumu</p>
        </div>

        <!-- Stats cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 mb-8"
             hx-get="/api/v1/partials/dashboard-stats"
             hx-trigger="load"
             hx-swap="innerHTML">
            {% for i in range(4) %}
            <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow animate-pulse">
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/2 mb-2"></div>
                <div class="h-8 bg-gray-200 dark:bg-gray-700 rounded w-1/3"></div>
            </div>
            {% endfor %}
        </div>

        <!-- Recent activity -->
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">Son Aktiviteler</h3>
            <div id="recent-activity"
                 hx-get="/api/v1/partials/recent-activity"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <p class="text-gray-500 dark:text-gray-400">Yükleniyor...</p>
            </div>
        </div>
    </main>
</div>
{% endblock %}
