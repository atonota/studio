{% extends "layouts/base.html" %}

{% block title %}Tenant'lar — atonota Studio{% endblock %}

{% block content %}
<div class="flex h-screen">
    {% include "partials/sidebar.html" %}

    <main class="flex-1 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Tenant'lar</h2>
                <p class="text-gray-500 dark:text-gray-400">Tüm tenant kayıtları</p>
            </div>
            <button onclick="document.getElementById('create-modal').classList.remove('hidden')"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="ph ph-plus"></i> Yeni Tenant
            </button>
        </div>

        <!-- Tenant list (HTMX ile yüklenir) -->
        <div id="tenant-list"
             hx-get="/api/v1/partials/tenant-list"
             hx-trigger="load"
             hx-swap="innerHTML">
            <div class="animate-pulse space-y-3">
                {% for i in range(5) %}
                <div class="bg-white dark:bg-gray-800 rounded-lg p-4 shadow">
                    <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/3 mb-2"></div>
                    <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-1/4"></div>
                </div>
                {% endfor %}
            </div>
        </div>
    </main>
</div>
{% endblock %}
